name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        exclude:
          # Node 20's test runner does not expand tests/*.test.js itself and
          # cmd.exe does not either; the Windows path is covered by 22 and 24.
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the read-only test role and schema
        # The setup scripts are run as written, through the container's Unix
        # socket (their local-server check passes). Only this CI copy gets a
        # random password and COMMIT instead of the final ROLLBACK.
        run: |
          pw="$(openssl rand -hex 16)"
          echo "AUSPEX_TEST_PASSWORD=$pw" >> "$GITHUB_ENV"
          sed -e "s/CHANGE_ME_LOCAL_TEST_PASSWORD/$pw/" -e 's/^ROLLBACK;$/COMMIT;/' scripts/local-test-setup.sql \
            | docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
          sed -e 's/^ROLLBACK;$/COMMIT;/' scripts/local-test-ddl.sql \
            | docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
      - name: Write pgpass for the Auspex role
        run: |
          printf 'localhost:5432:postgres:Auspex:%s\n' "$AUSPEX_TEST_PASSWORD" > "$RUNNER_TEMP/pgpass"
          chmod 600 "$RUNNER_TEMP/pgpass"
      - run: npm run test:local
        env:
          AUSPEX_HOME: ${{ runner.temp }}/auspex-home
          AUSPEX_DB_LOCAL: postgresql://Auspex@localhost:5432/postgres
          PGPASSFILE: ${{ runner.temp }}/pgpass

  desktop:
    name: Desktop build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Prepare UI (generates desktop/dist for the Rust build)
        run: npm run prepare-ui
        working-directory: desktop
      - name: Rust tests
        run: cargo test
        working-directory: desktop/src-tauri
      - name: Build desktop app
        run: npm run build
        working-directory: desktop
