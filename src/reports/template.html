<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AUSPEX_TITLE__ · Auspex Augur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #fcfcfb; --surface-2: #f0f1f3; --line: #e3e5e9; --line-strong: #d3d6dc;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
    --accent: #2a78d6; --accent-soft: #e6f0fc; --accent-ink: #1c5cab;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --good: #0ca30c; --good-ink: #006300; --good-soft: #e6f6e6;
    --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fff4dc;
    --critical: #d03b3b; --critical-soft: #fbeaea;
    --code: #f6f7f9;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c2a; --line-strong: #3a3a37;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
      --accent: #3987e5; --accent-soft: #1b2b42; --accent-ink: #86b6ef;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --good-ink: #4cc76a; --good-soft: #15301c; --warn-ink: #f0b64a; --warn-soft: #362a12; --critical-soft: #3a1a1a;
      --code: #161615; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c2a; --line-strong: #3a3a37;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #1b2b42; --accent-ink: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good-ink: #4cc76a; --good-soft: #15301c; --warn-ink: #f0b64a; --warn-soft: #362a12; --critical-soft: #3a1a1a;
    --code: #161615; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 24px 60px; }
  header.top { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .logo { width: 34px; height: 34px; flex: none; margin-top: 4px; }
  .logo .ring { transform-origin: 16px 16px; animation: spin 16s linear infinite; }
  .head { flex: 1; min-width: 260px; }
  .crumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-3); }
  .crumb { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--text-2); }
  h1 { margin: 6px 0 2px; font-size: 24px; letter-spacing: -.2px; }
  .desc { color: var(--text-2); margin: 0; max-width: 900px; }
  .meta { color: var(--text-3); font-size: 12px; margin-top: 6px; }
  .stale { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn-ink); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap; }
  .b-draft { background: var(--warn-soft); color: var(--warn-ink); }
  .b-approved { background: var(--good-soft); color: var(--good-ink); }
  .b-plan { background: var(--surface-2); color: var(--text-2); }
  .ctrls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 2px; }
  .seg button { border: 0; background: none; padding: 3px 9px; border-radius: 6px; font-size: 12px; color: var(--text-2); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .help-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--text-2); }
  .help-btn.on, .help-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

  .help { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; margin: 16px 0 0; animation: fade .25s var(--ease); }
  .help h2 { margin: 0 0 10px; font-size: 15px; }
  .help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 22px; }
  .help h3 { margin: 0 0 3px; font-size: 13px; color: var(--accent-ink); }
  .help p { margin: 0; color: var(--text-2); font-size: 13px; }
  .help code { font: 12px var(--mono); background: var(--surface-2); padding: 0 4px; border-radius: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 18px 0 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); animation: rise .4s var(--ease) both; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .v { font-size: 24px; font-weight: 600; letter-spacing: -.3px; margin-top: 2px; }
  .tile .d { font-size: 12px; color: var(--text-3); }
  .tile.hero .v { font-size: 32px; }

  .warns { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; }
  .warns li { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .warns li .ico { color: var(--warn-ink); font-weight: 700; }
  .ok-note { background: var(--good-soft); color: var(--good-ink); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; }

  nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  nav.tabs button { border: 0; background: none; padding: 9px 14px; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  nav.tabs .n { font-size: 11px; color: var(--text-3); margin-left: 4px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); animation: fade .3s var(--ease); }
  .panel-h { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .panel-h h2 { margin: 0; font-size: 14px; }
  .panel-h .hint { color: var(--text-3); font-size: 12px; }
  .panel-b { padding: 12px 16px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--text-3); }
  [data-tip] { cursor: help; text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }

  .tree { font-size: 13px; }
  .node { display: grid; grid-template-columns: minmax(260px, 1.6fr) minmax(120px, 1fr) 120px 110px 90px; gap: 10px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .node:hover { background: var(--surface-2); }
  .node.sel { background: var(--accent-soft); }
  .node .name { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .node .name .t { font-weight: 600; white-space: nowrap; }
  .node .name .r { font-family: var(--mono); font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .guide { color: var(--line-strong); font-family: var(--mono); white-space: pre; }
  .node .bar { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
  .node .bar i { position: absolute; inset: 0 auto 0 0; background: var(--s1); border-radius: 0 4px 4px 0; transform-origin: left; animation: grow .7s var(--ease) both; }
  .node .bar.hot i { background: var(--s2); }
  .node .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .node .est { color: var(--text-3); font-size: 12px; }
  .mis { color: var(--critical); font-weight: 600; font-size: 11px; }
  .tree-head { display: grid; grid-template-columns: minmax(260px, 1.6fr) minmax(120px, 1fr) 120px 110px 90px; gap: 10px; padding: 8px 16px; font-size: 12px; color: var(--text-2); font-weight: 600; border-bottom: 1px solid var(--line); }
  .tree-head .num { text-align: right; }
  .detail { padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; animation: fade .2s; }
  .detail dl { display: grid; grid-template-columns: 190px 1fr; gap: 4px 12px; margin: 0; }
  .detail dt { color: var(--text-3); }
  .detail dd { margin: 0; font-family: var(--mono); word-break: break-word; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--text-2); font-weight: 600; white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.mono { font-family: var(--mono); font-size: 12px; }
  .tbl-wrap { overflow: auto; max-height: 640px; }
  .masked-h { color: var(--warn-ink); }
  .null { color: var(--text-3); font-style: italic; }
  .pill { display: inline-block; font-size: 11px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin: 1px 2px 1px 0; }
  .arrow { color: var(--text-3); padding: 0 6px; }

  pre.sql { margin: 0; padding: 14px 16px; background: var(--code); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; overflow: auto; }
  .kw { color: var(--accent-ink); font-weight: 600; }
  .str { color: var(--good-ink); }
  .cm { color: var(--text-3); font-style: italic; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 10px; font-size: 12px; color: var(--text-2); }
  .btn:hover { background: var(--surface-2); color: var(--text); }

  .hist-chart svg { display: block; width: 100%; overflow: visible; }
  .hist-chart .axis { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hist-chart .grid { stroke: var(--line); }
  .diff { font: 12px/1.6 var(--mono); }
  .diff div { padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .add { background: var(--good-soft); }
  .diff .del { background: var(--critical-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--critical) 50%, transparent); }
  .diff-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  select { font: inherit; font-size: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  select option { background: var(--surface); color: var(--text); }

  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 7px 10px; font-size: 12px; max-width: 340px; opacity: 0; transition: opacity .12s; }
  .tip.show { opacity: 1; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 16px); opacity: 0; background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { margin-top: 26px; color: var(--text-3); font-size: 12px; text-align: center; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 760px) {
    .wrap { padding: 14px 16px 40px; }
    .node, .tree-head { grid-template-columns: 1fr 70px 70px; }
    .node .bar, .tree-head .c-bar, .node .est-col, .tree-head .c-est { display: none; }
    .detail dl { grid-template-columns: 1fr; }
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="var(--accent)" opacity=".14"/>

      <circle cx="16" cy="16" r="5" fill="var(--accent)"/>
    </svg>
    <div class="head" id="head"></div>
    <div class="ctrls">
      <button class="help-btn" id="helpBtn" aria-expanded="false">?</button>

</div>

<div class="toast" id="toast"></div>

// ---------- line diff (LCS) ----------
function diffLines(a, b) {

  while (i < m && j < n) { if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }
  while (i < m) out.push(['-', A[i++]]); while (j < n) out.push(['+', B[j++]]);

  } else if (state.tab === 'preview') {
    const masked = new Set(last.maskedColumns || []);
    put(view, h('div', { class: 'panel' }, h('div', { class: 'panel-h' }, h('h2', {}, t('preview')),
      h('span', { class: 'hint' }, t('previewHint', { n: fmt(last.preview.length) }) + (last.previewTruncated ? t('firstOnly') : '') + (masked.size ? t('masked', { c: [...masked].join(', ') }) : ''))),
      last.preview.length ? h('div', { class: 'tbl-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, last.columns.map(c => h('th', { class: masked.has(c.name) ? 'masked-h' : '', title: c.type }, c.name, masked.has(c.name) ? ' 🔒' : '')))),
        h('tbody', {}, last.preview.map(row => h('tr', {}, row.map((v, i) => h('td', { class: /int|numeric|double|real|decimal/.test(last.columns[i].type) ? 'num' : '' }, v === null ? h('span', { class: 'null' }, 'null') : String(v)))))))) : h('div', { class: 'empty' }, t('noRows'))));
  } else if (state.tab === 'history') {
    const runs = R.runs;
    const max = Math.max(1, ...runs.map(r => r.durationMs).filter(Number.isFinite));
    const W = 760, H = 180, L = 52, B = 22, pw = (W - L - 8) / Math.max(runs.length, 1), bw = Math.min(24, pw * 0.6);
    const NS = 'http://www.w3.org/2000/svg';
    const S2 = (tag, a) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
    const svg = S2('svg', { viewBox: `0 0 ${W} ${H}` });
    for (let i = 0; i <= 3; i++) { const y = 8 + (H - 8 - B) * i / 3; svg.append(S2('line', { class: 'grid', x1: L, x2: W - 8, y1: y, y2: y })); const tx = S2('text', { class: 'axis', x: L - 6, y: y + 4, 'text-anchor': 'end' }); tx.textContent = fmtMs(max * (1 - i / 3)); svg.append(tx); }
    const versions = [...new Set(runs.map(r => r.version))];
    runs.forEach((r, i) => {
      const x = L + pw * i + (pw - bw) / 2;
      if (!Number.isFinite(r.durationMs)) { const tx = S2('text', { class: 'axis', x: x + bw / 2, y: H - B - 4, 'text-anchor': 'middle' }); tx.textContent = '·'; svg.append(tx); return; }
      const hgt = Math.max(2, (H - 8 - B) * r.durationMs / max), y = H - B - hgt;
      const color = versions.indexOf(r.version) % 2 ? 'var(--s2)' : 'var(--s1)';
      const rect = S2('path', { d: `M${x},${H - B} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + bw - 4} Q${x + bw},${y} ${x + bw},${y + 4} V${H - B} Z`, fill: color });
      rect.addEventListener('pointermove', ev => showTip(ev, [fmtWhen(r.at), `v${r.version ?? '?'} · ${fmtMs(r.durationMs)}`, `${fmt(r.rows)} ${t('colRows').toLowerCase()} · ${t('colCost').toLowerCase()} ${fmt(r.totalCost)}`, `${r.warnings.length} ${t('colWarnings').toLowerCase()}`]));
      rect.addEventListener('pointerleave', hideTip);
      svg.append(rect);
    });
    const vs = R.sqlVersions || [];
    if (state.diffA === null && vs.length > 1) { state.diffA = vs.length - 2; state.diffB = vs.length - 1; }
    const sel = key => h('select', { onchange: ev => { state[key] = Number(ev.target.value); renderTab(); } }, vs.map((v, i) => h('option', { value: i, selected: state[key] === i ? true : null }, `v${v.version} · ${fmtWhen(v.savedAt)}${v.note ? ' · ' + v.note : ''}`)));
    put(view, h('div', { class: 'panel' },
      h('div', { class: 'panel-h' }, h('h2', {}, t('history')), h('span', { class: 'hint' }, t('historyHint'))),
      h('div', { class: 'panel-b hist-chart' }, runs.length ? svg : h('div', { class: 'empty' }, t('noRuns'))),
      h('div', { class: 'tbl-wrap', style: 'max-height:280px' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, t('colWhen')), h('th', {}, t('colSql')), h('th', {}, t('colMode')), h('th', { class: 'num' }, t('colDuration')), h('th', { class: 'num' }, t('colRows')), h('th', { class: 'num' }, t('colCost')), h('th', { class: 'num' }, t('colWarnings')))),
        h('tbody', {}, [...runs].reverse().map(r => h('tr', {}, h('td', {}, fmtWhen(r.at)), h('td', {}, `v${r.version ?? '?'}`), h('td', {}, r.analyzed ? t('modeAnalyze') : t('modePlan')),
          h('td', { class: 'num' }, fmtMs(r.durationMs)), h('td', { class: 'num' }, fmt(r.rows)), h('td', { class: 'num' }, fmt(r.totalCost)), h('td', { class: 'num' }, r.warnings.length))))))),
      h('div', { class: 'panel', style: 'margin-top:14px' },
        h('div', { class: 'panel-h' }, h('h2', {}, t('sqlChanges')), h('span', { class: 'hint' }, vs.length > 1 ? t('compare') : t('oneVersion'))),
        vs.length > 1 ? [h('div', { class: 'diff-bar' }, sel('diffA'), h('span', { class: 'arrow' }, '→'), sel('diffB')),
          h('div', { class: 'diff panel-b' }, diffLines(vs[state.diffA].sql, vs[state.diffB].sql).map(([k, line]) => h('div', { class: k === '+' ? 'add' : k === '-' ? 'del' : '' }, (k === ' ' ? '  ' : k + ' ') + line)))] : null));
  } else if (state.tab === 'sql') {
    put(view, h('div', { class: 'panel' }, h('div', { class: 'panel-h' }, h('h2', {}, `SQL v${activeVersion()?.version ?? '?'}`), h('span', { style: 'flex:1' }),
      h('button', { class: 'btn', onclick: () => copy(activeVersion()?.sql || '', 'SQL') }, t('copySql')),
      h('button', { class: 'btn', onclick: () => copy(JSON.stringify(R.last.plan, null, 2), 'Plan JSON') }, t('copyPlan'))),
      h('pre', { class: 'sql' }, highlight(activeVersion()?.sql || ''))));
  }
}

// ---------- theme, language, help ----------
function applyTheme(v) {
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  document.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  try { localStorage.setItem('auspex.report.theme', v); } catch {}
}
document.querySelectorAll('#theme button').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.v)));
// A host page (the Auspex viewer) may force a theme and language through <html data-theme / data-lang>.
const forcedTheme = document.documentElement.getAttribute('data-theme');
let savedTheme = forcedTheme || 'auto';
if (!forcedTheme) { try { savedTheme = localStorage.getItem('auspex.report.theme') || 'auto'; } catch {} }
applyTheme(savedTheme);
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.v;
  try { localStorage.setItem('auspex.report.lang', lang); } catch {}
  render();
}));
$('helpBtn').addEventListener('click', () => { state.help = !state.help; renderHelp(); });
render();
</script>
</body>
