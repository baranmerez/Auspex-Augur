<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="auspex-token" content="__AUSPEX_VIEWER_TOKEN__">
<title>Auspex Augur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #fcfcfb; --surface-2: #f0f1f3; --line: #e3e5e9; --line-strong: #d3d6dc;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
    --accent: #2a78d6; --accent-soft: #e6f0fc; --accent-ink: #1c5cab;
    --series-1: #2a78d6; --series-2: #eb6834;
    --good: #0ca30c; --good-ink: #006300; --good-soft: #e6f6e6;
    --critical: #d03b3b; --critical-soft: #fbeaea;
    --warn-soft: #fff4dc; --warn-ink: #8a5a00;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, .16);
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --radius: 10px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    /* Relation roles around a center table (Graph, ER diagram, Flow), each
       token in one place as light-dark(light theme, dark theme). Rank 1 uses
       -1 (strongest), rank 10 uses -10 (faintest), ranks between are mixed. */
    --role-ref-1: light-dark(#0b4a9e, #8fc1ff); --role-ref-10: light-dark(#b4cff2, #2b4669);
    --role-dep-1: light-dark(#a33a05, #ffac70); --role-dep-10: light-dark(#f6cdb0, #6b3b1d);
    --role-other: light-dark(#a3a7ae, #5b5d61);
    --lane-ref: light-dark(#eef4fc, #16202d); --lane-center: light-dark(#f2f3f5, #1f1f1e); --lane-dep: light-dark(#fdf2ea, #261c15);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c2a; --line-strong: #3a3a37;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
      --accent: #3987e5; --accent-soft: #1b2b42; --accent-ink: #86b6ef;
      --series-1: #3987e5; --series-2: #d95926;
      --good-ink: #4cc76a; --good-soft: #15301c; --critical-soft: #3a1a1a; --warn-soft: #362a12; --warn-ink: #f0b64a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c2a; --line-strong: #3a3a37;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #1b2b42; --accent-ink: #86b6ef;
    --series-1: #3987e5; --series-2: #d95926;
    --good-ink: #4cc76a; --good-soft: #15301c; --critical-soft: #3a1a1a; --warn-soft: #362a12; --warn-ink: #f0b64a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* Header */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .top-inner { padding: 12px 24px 0; }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { width: 30px; height: 30px; flex: none; }
  .logo .ring { transform-origin: 16px 16px; animation: spin 14s linear infinite; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .brand .sub { color: var(--text-3); font-size: 13px; }
  .brand .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2);
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); position: relative; }
  .live.on .dot { background: var(--good); }
  .live.on .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--good);
    animation: pulse 1.8s var(--ease) infinite; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--text-2); transition: background .15s, border-color .15s; }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--text-2); transition: background .15s, color .15s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }

  /* On narrow widths the tab row scrolls inside itself, never the page. */
  nav.tabs { display: flex; gap: 2px; margin-top: 10px; position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: none; white-space: nowrap; border: 0; background: none; padding: 10px 14px; color: var(--text-2); font-weight: 500; position: relative; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.on { color: var(--text); }
  nav.tabs .count { font-size: 11px; color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tab-ink { position: absolute; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; transition: left .3s var(--ease), width .3s var(--ease); }

  /* Full width; the page is the only vertical scroller. Side panels below the
     sticky header use --sticky-top and keep their own max-height. */
  main { padding: 16px 24px 60px; }
  :root { --sticky-top: 130px; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .field { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 0 8px; height: 32px; transition: border-color .15s; }
  .field:focus-within { border-color: var(--accent); }
  .field label { font-size: 12px; color: var(--text-3); }
  .field select, .field input { border: 0; background: none; outline: none; height: 30px; font-size: 13px; }
  .field input[type=date] { width: 128px; }
  .search { flex: 1; min-width: 220px; max-width: 420px; }
  .search input { width: 100%; }
  .search kbd { font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; margin-bottom: 14px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 4px 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-ink); animation: pop .25s var(--ease); }
  .chip button { border: 0; background: none; color: inherit; width: 18px; height: 18px; border-radius: 50%; line-height: 1; }
  .chip button:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .chips .clear { border: 0; background: none; color: var(--text-3); font-size: 12px; text-decoration: underline; }
  .chips .scope { font-size: 12px; color: var(--text-3); }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-h { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 0; }
  .panel-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-h .hint { color: var(--text-3); font-size: 12px; }
  .panel-h .grow { flex: 1; }
  .panel-b { padding: 12px 16px 16px; }
  .grid { display: grid; gap: 14px; }
  .g-tiles { grid-template-columns: 1.4fr repeat(5, 1fr); }
  .g-2 { grid-template-columns: 1fr 1fr; }
  .g-main { grid-template-columns: 2fr 1fr; }
  .stack > * + * { margin-top: 14px; }

  .tile { padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -.3px; }
  .tile .d { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .tile.hero .v { font-size: 48px; line-height: 1.05; letter-spacing: -1px; }
  .tile .v.bad { color: var(--critical); }
  .status-ico { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* Charts */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .grid-line { stroke: var(--line); stroke-width: 1; }
  .chart .axis-text { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .bar { transition: opacity .15s, transform .7s var(--ease); }
  .chart .bar.grow-y { transform: scaleY(0); }
  .chart .bar.grow-x { transform: scaleX(0); }
  .chart.ready .bar.grow-y, .chart.ready .bar.grow-x { transform: none; }
  .chart .hit { fill: transparent; }
  .chart .hit:hover + .bar, .chart .col:hover .bar { opacity: .82; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .hbars { display: grid; grid-template-columns: minmax(90px, max-content) 1fr auto; gap: 7px 10px; align-items: center; font-size: 13px; }
  .hbars .lbl { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .hbars .track { height: 14px; position: relative; }
  .hbars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 4px 4px 0;
    transform-origin: left; transform: scaleX(0); transition: transform .7s var(--ease), opacity .15s; }
  .ready .hbars .fill { transform: scaleX(1); }
  .hbars .row:hover .fill, .hbars .fill:hover { opacity: .82; }
  .hbars .val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; text-align: right; }
  .hbars .sub { color: var(--text-3); font-weight: 400; margin-left: 6px; }
  .hbars .row { display: contents; cursor: pointer; }

  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 8px; box-shadow: var(--shadow-lg); padding: 8px 10px; font-size: 12px; min-width: 140px;
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  .tip.show { opacity: 1; transform: none; }
  .tip .t { color: var(--text-3); margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 8px; }
  .tip .r b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
  .tip .key { width: 12px; height: 2px; border-radius: 1px; }

  /* Lists */
  .mini { list-style: none; margin: 0; padding: 0; }
  .mini li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .mini li:first-child { border-top: 0; }
  .mini li:hover .sql { color: var(--text); }
  .mini .sql { font: 12px var(--mono); color: var(--text-2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .15s; }
  .mini .ms { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .mini .when { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .mini .err { color: var(--critical); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }

  /* Table */
  .tbl-tools { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tbl-tools .grow { flex: 1; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--text-2); font-weight: 600; white-space: nowrap; user-select: none; background: var(--surface); }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--text); }
  th .arr { display: inline-block; margin-left: 4px; color: var(--accent); transition: transform .2s; }
  th .arr.desc { transform: rotate(180deg); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.time { font: 12px var(--mono); color: var(--text-2); white-space: nowrap; }
  td.sum { font: 12px var(--mono); max-width: max(520px, 40vw); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tr.r { cursor: pointer; transition: background .15s; }
  tr.r:hover { background: var(--surface-2); }
  tr.r.open { background: var(--accent-soft); }
  tr.r.enter { animation: rowin .35s var(--ease) both; }
  tr.r.fresh td { animation: flash 2.4s var(--ease); }
  .dur { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .dur .bar { height: 4px; border-radius: 2px; background: var(--series-1); opacity: .55; min-width: 2px; }
  tr.d td { background: var(--surface-2); padding: 0; }
  .detail { padding: 14px 16px; animation: open .25s var(--ease); }
  .detail pre { margin: 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
  .detail .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 16px; margin: 10px 0; font-size: 12px; }
  .detail .meta span { color: var(--text-3); }
  .detail .acts { display: flex; gap: 8px; margin-top: 10px; }
  .error-box { background: var(--critical-soft); color: var(--critical); padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; color: var(--text-2); }
  .pager .grow { flex: 1; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.mcp { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.script { background: var(--warn-soft); color: var(--warn-ink); }
  .badge.old { background: var(--surface-2); color: var(--text-3); }
  .badge.ok { background: var(--good-soft); color: var(--good-ink); }
  .badge.err { background: var(--critical-soft); color: var(--critical); }
  .badge .sw { width: 6px; height: 6px; border-radius: 50%; }

  /* Profiles */
  .profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .pcard { padding: 16px; transition: transform .2s var(--ease), box-shadow .2s; animation: rise .4s var(--ease) both; }
  .pcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .pcard h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .pcard .desc { color: var(--text-2); margin: 4px 0 12px; }
  .pcard .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .pcard .stats div { background: var(--surface-2); border-radius: 8px; padding: 8px; }
  .pcard .stats b { display: block; font-size: 17px; }
  .pcard .stats span { font-size: 11px; color: var(--text-3); }
  .pcard dl { display: grid; grid-template-columns: 100px 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
  .pcard dt { color: var(--text-3); }
  .pcard dd { margin: 0; font: 12px var(--mono); word-break: break-all; }
  .paths { margin-top: 18px; font: 12px var(--mono); color: var(--text-3); }
  .paths div { margin: 3px 0; }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-3); }
  .empty svg { width: 42px; height: 42px; opacity: .5; display: block; margin: 0 auto 8px; }
  .muted { color: var(--text-3); }
  .view { animation: fade .3s var(--ease); }

  /* Database switcher */
  .dbsel { position: relative; }
  .dbsel > button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface);
    border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 13px; transition: border-color .15s, box-shadow .15s; }
  .dbsel > button:hover, .dbsel.open > button { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .dbsel .lbl { color: var(--text-3); font-size: 12px; }
  .dbsel .val { font-weight: 650; }
  .dbsel .caret { color: var(--text-3); transition: transform .2s var(--ease); }
  .dbsel.open .caret { transform: rotate(180deg); }
  .db-ico { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .dbmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 300px; max-width: 380px; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; display: none; animation: pop .18s var(--ease); }
  .dbsel.open .dbmenu { display: block; }
  .dbmenu button { width: 100%; display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 10px; align-items: center; text-align: left;
    border: 0; background: none; border-radius: 8px; padding: 8px 10px; }
  .dbmenu button:hover { background: var(--surface-2); }
  .dbmenu button.on { background: var(--accent-soft); }
  .dbmenu .n { font-weight: 600; }
  .dbmenu .d { grid-column: 2 / 4; font-size: 12px; color: var(--text-3); }
  .dbmenu .c { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .dbmenu .chk { color: var(--accent); font-weight: 700; }
  .dbmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  .thsel { position: relative; }
  #themeMenuBtn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .thmenu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; width: 340px; max-width: calc(100vw - 24px); max-height: calc(100vh - 80px); overflow: auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 8px 10px 10px; display: none; animation: pop .18s var(--ease); }
  .thsel.open .thmenu { display: block; }
  .th-h { font-size: 11px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); margin: 8px 2px 4px; }
  .th-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .th-item { display: flex; align-items: center; border-radius: 8px; border: 1px solid transparent; }
  .th-item.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .th-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 6px; border-radius: 8px; text-align: left; font-size: 13px; color: var(--text); }
  .th-pick span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .th-pick:hover { background: var(--surface-2); }
  .th-del { border: 0; background: none; color: var(--text-3); width: 24px; height: 24px; border-radius: 6px; flex: none; }
  .th-del:hover { background: var(--critical-soft); color: var(--critical); }
  .th-sw { width: 26px; height: 18px; border-radius: 5px; border: 1px solid; display: inline-flex; align-items: center; justify-content: center; gap: 3px; flex: none; }
  .th-sw i { width: 6px; height: 6px; border-radius: 50%; }
  .th-empty { font-size: 12px; color: var(--text-3); padding: 2px; }
  .th-gen { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .th-gen label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-2); }
  .th-gen label.wide { grid-column: 1 / -1; }
  .th-gen label.wide input { flex: 1; }
  .th-gen label.chk { grid-column: 1 / -1; justify-content: flex-start; }
  .th-gen input[type=color] { width: 40px; height: 26px; padding: 0 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
  .th-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

  .th-warn { background: var(--warn-soft); color: var(--warn-ink); }

  .icon-btn.primary { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--surface); }

  /* Toolbar */
  .toolbar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 10px 12px; display: grid; gap: 8px; margin-bottom: 10px; }

  .toolbar[data-mode="profiles"] .when, .toolbar[data-mode="profiles"] .opsonly { display: none; }
  .toolbar[data-mode="profiles"] { display: none; }
  .field select { background: transparent; color: var(--text); cursor: pointer; }
  select option { background: var(--surface); color: var(--text); }

  /* Reports */
  .rep { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .rep-list { max-height: calc(100vh - var(--sticky-top) - 20px); overflow: auto; position: sticky; top: var(--sticky-top); }
  .rep-filter { flex: 1 1 100%; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
  .rep-filter:focus { border-color: var(--accent); }
  .rep-list .stagebar .seg { flex: 1 1 0; min-width: 0; flex-wrap: wrap; }
  .rep-list .stagebar > .icon-btn { flex: none; align-self: flex-start; }
  .rep-list .stagebar { padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .rep.collapsed { grid-template-columns: auto minmax(0, 1fr); }
  .rep-rail { position: sticky; top: var(--sticky-top); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 6px; }
  .rep-rail .rail-label { writing-mode: vertical-rl; font-size: 12px; color: var(--text-3); white-space: nowrap; }
  @media (max-width: 900px) { .rep.collapsed { grid-template-columns: 1fr; } .rep-rail { position: static; flex-direction: row; justify-content: flex-start; } .rep-rail .rail-label { writing-mode: horizontal-tb; } }
  .rep-group { padding: 8px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); }
  .rep-group .path { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text-2); }
  .rep-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px 8px 14px; border-left: 3px solid transparent;
    transition: background .15s, border-color .15s; }
  .rep-item:hover { background: var(--surface-2); }
  .rep-item.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .rep-item .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .rep-item .s { font-size: 12px; color: var(--text-3); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .badge.draft { background: var(--warn-soft); color: var(--warn-ink); }
  .badge.approved { background: var(--good-soft); color: var(--good-ink); }
  .badge.execute { background: var(--critical-soft); color: var(--critical); }
  .badge.viewer { background: var(--good-soft); color: var(--good-ink); }
  .icon-btn:disabled { opacity: .55; cursor: default; pointer-events: none; }
  .dlg { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg);
    padding: 18px 20px; width: min(440px, calc(100vw - 32px)); }
  .dlg::backdrop { background: rgba(0, 0, 0, .35); }
  .dlg h3 { margin: 0 0 6px; font-size: 15px; }
  .dlg p { margin: 0 0 12px; font-size: 13px; color: var(--text-2); }
  .dlg dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 16px; font-size: 13px; }
  .dlg dt { color: var(--text-3); }
  .dlg dd { margin: 0; overflow-wrap: anywhere; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .rep-view { min-height: 420px; display: flex; flex-direction: column; overflow: hidden; }
  /* The HTML report posts its own height (see themedReport), so the frame grows
     with it and never scrolls on its own; until then it fills the window. */
  .rep-view .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .rep-view .bar .grow { flex: 1; }
  .rep-view .crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
  .rep-view .crumb { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--text-2); }
  .rep-view iframe { width: 100%; height: calc(100vh - 230px); min-height: 520px; border: 0; background: var(--bg); display: block; }
  .rep-view pre { margin: 0; padding: 14px 16px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
  .rep-view pre.sql { white-space: pre; word-break: normal; overflow-x: auto; tab-size: 4; }
  .rep-view pre.sql.wrap { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
  .rep-view pre.sql .sq-line { min-height: 1.6em; }

  .rep-view pre.sql .sq-step-line { margin-top: 8px; padding-top: 3px; border-top: 1px dashed var(--line-strong); }
  .rep-view pre.sql .sq-step-line:first-child { margin-top: 0; border-top: 0; }
  .sq-kw { color: var(--accent-ink); font-weight: 600; }
  .sq-fn { color: color-mix(in oklab, var(--accent-ink) 55%, var(--critical)); }
  .sq-id { color: color-mix(in oklab, var(--text) 80%, var(--accent)); }
  .sq-str { color: var(--good-ink); }
  .sq-num { color: var(--warn-ink); }
  .sq-param { color: var(--critical); font-weight: 600; }
  .sq-dq { color: var(--warn-ink); font-weight: 600; }
  .sq-op { color: var(--text-2); }
  .sq-cm { color: var(--text-3); font-style: italic; }
  .sq-step { color: var(--accent-ink); font-weight: 700; background: var(--accent-soft); border-radius: 4px; }
  .rep-empty { padding: 60px 30px; text-align: center; color: var(--text-3); }
  .rep-empty b { color: var(--text); }
  .rep-empty code { font: 12px var(--mono); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
  @media (max-width: 900px) { .rep { grid-template-columns: minmax(0, 1fr); } .rep-list { position: static; max-height: 360px; } }
  .loading .view { opacity: .55; transition: opacity .2s; }

  /* Schema memory */
  .toolbar[data-mode="schema"] .when, .toolbar[data-mode="schema"] .opsonly { display: none; }
  .chg-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--warn-ink) 35%, transparent);
    background: var(--warn-soft); color: var(--warn-ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; animation: pop .25s var(--ease); }
  .chg-badge[hidden] { display: none; }
  .chg-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn-ink); }
  .sch-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; }
  .sch-bar .grow { flex: 1; }
  .sch-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .sch-stats b { color: var(--text); font-variant-numeric: tabular-nums; margin-right: 3px; }
  .sch { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; margin-top: 14px; }
  .sch-canvas { position: relative; overflow: hidden; height: calc(100vh - 300px); min-height: 520px; }
  .sch-canvas.er { height: auto; overflow-x: auto; overflow-y: hidden; }
  .sch-canvas svg.graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
  .sch-canvas svg.graph.panning { cursor: grabbing; }
  .g-edge { stroke: var(--line-strong); stroke-width: 1.2; transition: opacity .2s; }
  .g-edge.used { stroke: var(--accent); stroke-dasharray: 6 4; }
  .g-edge.suggested { stroke: var(--warn-ink); stroke-dasharray: 2 4; }
  .g-edge.hot { stroke: var(--accent); stroke-width: 2; }
  .g-edge.pending, .g-node.pending { opacity: 0; }
  .g-edge.role { stroke-width: 2.2; }
  .g-edge.role.hot { stroke-width: 3.2; }
  .g-edge.faint { stroke: var(--role-other); stroke-dasharray: 4 4; opacity: .6; }
  svg.graph.hide-faint .g-edge.faint { display: none; }
  .g-node { cursor: pointer; transition: opacity .4s var(--ease); }
  .g-node circle.body { stroke-width: 1.5; }
  .g-node.explored circle.body { fill: var(--accent); stroke: var(--surface); }
  .g-node.seen circle.body { fill: var(--accent-soft); stroke: var(--accent); }
  .g-node.unexplored circle.body { fill: var(--surface); stroke: var(--text-3); stroke-dasharray: 3 2; }
  .g-node.sel circle.body { stroke: var(--text); stroke-width: 3; stroke-dasharray: none; }
  .g-node text.lbl { font-size: 11px; fill: var(--text-2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; pointer-events: none; transition: opacity .2s; }
  .g-node.explored text.lbl { fill: var(--text); font-weight: 600; font-size: 12px; }
  .g-node.unexplored text.lbl { opacity: .8; }
  svg.graph.crowded .g-node.unexplored text.lbl { opacity: 0; }
  svg.graph.crowded.zoomed .g-node.unexplored text.lbl, svg.graph .g-node.hot text.lbl { opacity: 1; }
  .g-node .nb circle { fill: var(--warn-ink); stroke: var(--surface); stroke-width: 1.5; }
  .g-node .nb text { fill: var(--surface); font-size: 9px; font-weight: 700; pointer-events: none; }
  svg.graph.hovering .g-node:not(.hot), svg.graph.hovering .g-edge:not(.hot) { opacity: .16; }
  svg.graph.searching .g-node:not(.match) { opacity: .18; }
  .g-node.outside { opacity: .45; }
  .g-edge.outside { opacity: .35; }
  .sch-pick h4 { margin: 0 0 4px; }
  .sch-pick p { margin: 0 0 10px; font-size: 13px; }
  .sch-pick .nlist li { display: flex; gap: 8px; align-items: center; }
  .sch-pick .nlist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-legend { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-2);
    background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: calc(100% - 70px); }
  .sch-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .g3d-host { position: absolute; inset: 0; }
  .g3d-host canvas { display: block; }
  .g3d-bar { position: absolute; left: 12px; top: 10px; right: 56px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .g3d-bar > * { pointer-events: auto; }
  .g3d-status { font-size: 12px; color: var(--text-2); background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 9px; overflow-wrap: anywhere; }
  .g3d-bar .icon-btn:disabled { opacity: .45; cursor: default; }
  .g3d-tip { font: 12px/1.4 "Segoe UI", system-ui, sans-serif; }
  .g3d-tip b { display: block; }
  /* Own stacking context: the per-label z-index never reaches the header, menus, tooltip or toast. */
  .g3d-labels { position: absolute; inset: 0; z-index: 0; isolation: isolate; overflow: hidden; pointer-events: none; }
  .g3d .g3d-bar, .g3d .sch-zoom, .g3d .sch-legend { z-index: 1; }
  .g3d-lbl, .g3d-layer { position: absolute; left: 0; top: 0; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis;
    font-size: 12px; line-height: 1.3; padding: 1px 6px; border-radius: 5px; color: var(--text); will-change: transform;
    background: color-mix(in srgb, var(--surface) 84%, transparent); }
  .g3d-lbl.ref { border-right: 3px solid var(--role-ref-1); }
  .g3d-lbl.dep { border-left: 3px solid var(--role-dep-1); }
  .g3d-lbl.center { font-weight: 650; border: 1px solid var(--line-strong); }
  .g3d-lbl.dim { opacity: .35; }
  .g3d-layer { font-weight: 650; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); }
  .g3d-layer.ref { color: var(--role-ref-1); }
  .g3d-layer.dep { color: var(--role-dep-1); }
  .g3d-picks { display: contents; }
  .g3d-pick { display: inline-flex; align-items: center; gap: 5px; background: color-mix(in srgb, var(--surface) 90%, transparent); border-radius: 8px; padding-left: 6px; }
  .g3d-bar .icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .sch-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .sch-zoom button { width: 30px; height: 30px; padding: 0; justify-content: center; }
  .insp { position: sticky; top: var(--sticky-top); max-height: calc(100vh - var(--sticky-top) - 20px); overflow: auto; }
  .insp h3 { margin: 0; font-size: 15px; word-break: break-all; }
  .insp .sub { font-size: 12px; color: var(--text-3); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .insp .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
  .insp .facts div { background: var(--surface-2); border-radius: 8px; padding: 7px 9px; }
  .insp .facts b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .insp .facts span { font-size: 11px; color: var(--text-3); }
  .insp h4 { margin: 16px 0 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; display: flex; gap: 8px; }
  .insp h4 .grow { flex: 1; }
  .insp h4 button { border: 0; background: none; color: var(--accent-ink); font-size: 11px; text-transform: none; letter-spacing: 0; padding: 0; }
  .insp .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .note { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; animation: rise .3s var(--ease) both; }
  .note.observation { border-left-color: var(--good); }
  .note.inference { border-left-color: var(--warn-ink); border-left-style: dashed; }
  .note.archived { opacity: .55; }
  .note .nh { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--text-3); margin-bottom: 3px; flex-wrap: wrap; }
  .note .nh code { font: 11px var(--mono); color: var(--text-2); }
  .note .fig { font: 11px/1.5 var(--mono); color: var(--text-2); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .badge.rule { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.observation { background: var(--good-soft); color: var(--good-ink); }
  .badge.inference { background: var(--warn-soft); color: var(--warn-ink); }
  .badge.explored { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.seen, .badge.unexplored { background: var(--surface-2); color: var(--text-3); }
  .nlist { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .nlist li { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .nlist li:first-child { border-top: 0; }
  .nlist li:hover .nm { color: var(--accent-ink); }
  .nlist .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nlist .cols { margin-left: auto; font: 11px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42%; flex: none; }
  .er-box .frame { fill: var(--surface); stroke: var(--line-strong); }
  .er-box.center .frame { stroke: var(--accent); stroke-width: 2; }
  .er-box.unexplored .frame { stroke-dasharray: 4 3; }
  .er-box .head { fill: var(--surface-2); }
  .er-box.center .head { fill: var(--accent-soft); }
  .er-box text { font-size: 12px; fill: var(--text); }
  .er-box text.h { font-weight: 650; }
  .er-box text.ty { fill: var(--text-3); font: 11px var(--mono); }
  .er-box text.tag { font-size: 10px; font-weight: 700; fill: var(--accent-ink); }
  .er-box text.more { fill: var(--accent-ink); cursor: pointer; font-size: 12px; }
  .er-box text.dim { fill: var(--text-3); font-style: italic; }
  .er-box { cursor: pointer; animation: rise .35s var(--ease) both; }
  .er-box.center { cursor: default; }
  .er-link { fill: none; stroke: var(--line-strong); stroke-width: 1.4; transition: opacity .2s, stroke .2s; }
  .er-link.used { stroke: var(--accent); stroke-dasharray: 6 4; }
  .er-link.suggested { stroke: var(--warn-ink); stroke-dasharray: 2 4; }
  .er-link.hot { stroke: var(--accent); stroke-width: 2.2; }
  svg.er.hovering .er-link:not(.hot), svg.er.hovering .er-box:not(.hot):not(.center) { opacity: .25; }
  svg.er .er-box.outside:not(.hot), .flow .fl-node.outside:not(.hot) { opacity: .5; }
  svg.er.hovering .er-box.outside:not(.hot), .flow.hovering .fl-node.outside:not(.hot) { opacity: .2; }
  .er-link.role { stroke-width: 1.8; }
  .er-link.role.hot { stroke-width: 3; }
  .er-box text.meta { font-size: 11px; fill: var(--text-2); font-variant-numeric: tabular-nums; }
  .er-box text.meta.off { fill: var(--text-3); font-style: italic; }
  /* One fixed column per side: a label change on one side never moves the other side's button. */
  .role-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 10px 12px 0; }
  .role-head .rh.dep { justify-content: flex-end; text-align: right; }
  @media (max-width: 640px) { .role-head { grid-template-columns: 1fr; } .role-head .rh.dep { justify-content: flex-start; text-align: left; } }
  .role-head .rh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }

  .role-sw.dep { background: linear-gradient(90deg, var(--role-dep-1), var(--role-dep-10)); }
  .icon-btn.sm { padding: 2px 8px; font-size: 12px; }

  .nlist .rk { font: 11px var(--mono); color: var(--text-3); min-width: 24px; flex: none; }
  /* Flow view: Reference -> Center -> Dependent swimlanes */

  .flow-trail { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 12px 0; font-size: 12px; color: var(--text-3); }
  .flow-trail .crumb { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--text-2); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flow-trail .crumb:hover { border-color: var(--accent); color: var(--text); }
  .flow-trail .crumb.cur { font-weight: 650; color: var(--text); border-color: var(--accent); cursor: default; }
  .flow { position: relative; flex: none; margin: 6px 0 0; }

  .fl-lane-bg { stroke: color-mix(in srgb, var(--line) 70%, transparent); }

  .fl-lane-h .rh { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }

const relRe = /\b(?:from|join)\s+((?:"[^"]+"|[a-z_][\w$]*)(?:\s*\.\s*(?:"[^"]+"|[a-z_][\w$]*))?)/gi;

// ---------- range ----------
function resolveRange() {
  const today = localDay(new Date());
  switch (state.range) {
    case 'today': return [today, today];
    case 'yesterday': { const y = addDays(today, -1); return [y, y]; }
    case '7': return [addDays(today, -6), today];
    case '30': return [addDays(today, -29), today];
    case 'all': return [state.days.length ? state.days[state.days.length - 1].day : today, today];
    default: return [state.from || today, state.to || today];
  }
}

async function load({ quiet = false } = {}) {
  document.body.classList.add('loading');
  $('refreshBtn').classList.add('spin');
  try {
    state.days = (await getJson('/api/days')).sort((a, b) => a.day.localeCompare(b.day));
    const [from, to] = resolveRange();
    $('from').value = from; $('to').value = to;
    // Log files are named by UTC day; fetch one extra day each side, filter by local day.
    const rows = await getJson(`/api/logs?from=${addDays(from, -1)}&to=${addDays(to, 1)}`);
    state.all = rows.filter(e => { if (!e.ts) return true; const d = localDay(new Date(e.ts)); return d >= from && d <= to; })
      .map((e, i) => ({ ...e, _id: (e.ts || '') + '|' + (e.tool || '') + '|' + i }));
    if (!state.profiles || !quiet) state.profiles = await getJson('/api/profiles');
    try { state.reports = await getJson('/api/reports'); } catch (err) { state.reports = { error: err.message, reports: [] }; }
    try { state.memory = await getJson('/api/memory'); } catch (err) { state.memory = { error: err.message, profiles: [] }; }
    const fresh = new Set();
    if (!state.firstLoad) for (const e of state.all) if (!state.seen.has(e._id)) fresh.add(e._id);
    state.seen = new Set(state.all.map(e => e._id));
    state.fresh = fresh;
    if (fresh.size && quiet) toast(t('{n} new operations', { n: fresh.size }));
    state.firstLoad = false;
    syncFilterOptions();
    render();
  } catch (err) {
    $('v-' + state.tab).replaceChildren(h('div', { class: 'panel' }, h('div', { class: 'error-box', style: 'margin:16px' }, t('Could not load data: ') + err.message)));

    document.body.classList.remove('loading');
    $('refreshBtn').classList.remove('spin');
  }
}

        const ny = rowY(b.y, b.box.top, Math.max(0, b.bcols.indexOf(l.nbCols[k] ?? l.nbCols[0])));

// ---------- Flow view ----------
// Reference -> Center -> Dependent swimlanes; a Dependent can open its own
// dependents as one more lane (depth 2). Clicking a table makes it the center;
// the trail above leads back. Pure HTML cards over an SVG edge layer.
// The center card sits in the Merkez lane: name, state, row estimate, column

  state.memFlowCenter = id;

function flowLanes(data, centerId) {
  const roles = roleGroups(data, centerId);

  const lanes = [

function flowCenterCard(data, centerId, rec) {
  const node = data.nodes.find(n => n.id === centerId) || { id: centerId, state: 'unexplored' };
  const { cols, keyCols, tagsOf, pk, notes } = centerColumns(data, centerId, rec);

    nCols ? t('{n} columns', { n: fmt(nCols) }) : null, t('{n} notes', { n: fmt(notes.length) })].filter(Boolean).join(' · ');

async function buildFlow(wrap, data, centerId, key) {
  if (state.memFlowCenter !== centerId) { state.memFlowTrail = []; state.memFlowOpen = null; state.memFlowCenter = centerId; }
  const cNode = data.nodes.find(n => n.id === centerId);
  const rec = cNode?.file ? await memTable(state.db, cNode.file, data.generatedAt) : null;
  if (state.schemaKey !== key) return;
  const lanes = flowLanes(data, centerId);
  const n = lanes.length;
  const W = Math.max((wrap.clientWidth || 1000) - 2, n * FL.minLane);
  const laneW = W / n, nodeW = Math.min(FL.nodeMaxW, laneW - 36), cardW = Math.min(FL.cMaxW, laneW - 24);
  const card = flowCenterCard(data, centerId, rec);
  const rows = Math.max(1, ...lanes.filter(l => l.key !== 'center').map(l => l.items.length));
  const contentH = Math.max(rows * (FL.nodeH + FL.gap) - FL.gap, card.hgt);
  const top = FL.head + FL.pad;
  const H = top + contentH + FL.pad + FL.foot;
  const pos = new Map();
  const host = h('div', { class: 'flow', style: `width:${W}px;height:${H}px` });
  const edges = svg('svg', { class: 'fl-edges', width: W, height: H, viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
  host.append(edges);
  const depCount = id => roleGroups(data, id).dep.filter(x => x.id !== centerId).length;
  const parentOf = l => (l.key === 'dep2' ? l.parent : centerId);

  lanes.forEach((lane, li) => {
    const x0 = li * laneW;
    edges.append(svg('rect', { class: 'fl-lane-bg', x: x0 + 6, y: 6, width: laneW - 12, height: H - 12, rx: 12, style: `fill:var(--lane-${lane.bg})` }));
    const head = lane.key === 'center'
      ? h('div', { class: 'rh' }, h('b', {}, lane.title), h('span', {}, t('selected table')))
      : roleHeader('flow', lane.key, lane.all, lane.title, lane.bg);
    host.append(h('div', { class: 'fl-lane-h', title: lane.tip || null, style: `left:${x0 + 18}px;top:16px;width:${laneW - 36}px` }, head));
    if (lane.key === 'center') {
      const x = Math.round(x0 + (laneW - cardW) / 2);
      pos.set(centerId, { x, y: top, w: cardW, h: card.hgt });
      card.el.style.cssText = `left:${x}px;top:${top}px;width:${cardW}px;height:${card.hgt}px`;
      host.append(card.el);
      return;
    }
    const bh = lane.items.length * (FL.nodeH + FL.gap) - FL.gap;
    const parentY = lane.parent ? pos.get(lane.parent)?.y : null;
    // Lanes start at the top so one lane's top-N picker never moves
    // the cards of another lane; only the depth-2 lane follows its parent.
    const want = parentY !== null && parentY !== undefined ? parentY + FL.nodeH / 2 - bh / 2 : top;
    const y0 = Math.max(top, Math.min(top + contentH - bh, want));
    const x = Math.round(x0 + (laneW - nodeW) / 2);
    lane.items.forEach((it, i) => {
      const y = Math.round(y0 + i * (FL.nodeH + FL.gap));
      pos.set(lane.key === 'dep2' ? 'dep2|' + it.id : it.id, { x, y, w: nodeW, h: FL.nodeH });
      const st = it.node?.state || 'unexplored';
      const joins = joinLabels(it, parentOf(lane));
      const kids = lane.key === 'dep' ? depCount(it.id) : null;
      const isOpen = state.memFlowOpen === it.id && lane.key === 'dep';
      const expTip = kids ? t(isOpen ? 'Hide the dependents of {t}' : 'Open the dependents of {t} ({n} tables)', { t: it.id, n: fmt(kids) })
        : t('No further dependents of {t} are known', { t: it.id });
      host.append(h('div', { class: `fl-node ${st}${isOpen ? ' open' : ''}${outsideScope(data, it.id) ? ' outside' : ''}`, 'data-id': it.id,
        style: `left:${x}px;top:${y}px;width:${nodeW}px;height:${FL.nodeH}px;${reduceMotion ? '' : `animation-delay:${Math.min(li * 60 + i * 30, 600)}ms`}` },
        h('span', { class: 'bar', style: `background:${roleColor(it.role, it.rank)}` }),
        h('button', { class: 'main', title: `${it.id}\n${roleName(it.role)} #${it.rank} · ${roleFigure(it)}\n${joins.join('\n')}\n${t('Click to make it the center')}`,
          onclick: () => flowCenter(it.id) },
          h('span', { class: 'nm' }, it.id), h('span', { class: 'mt' }, `#${it.rank} · ${roleFigure(it)} · ${stateLabel(st)}`),
          h('span', { class: 'jn' }, joins[0] || '', joins.length > 1 ? ` +${joins.length - 1}` : '')),

      trail.map((id, i) => [h('button', { class: 'crumb', title: id, onclick: () => flowBack(i) }, id), '›']),
      h('span', { class: 'crumb cur', title: centerId }, centerId)),

  if (!$('thsel').classList.contains('open')) return false;
  $('thsel').classList.remove('open'); $('themeMenuBtn').setAttribute('aria-expanded', 'false');
  if (themePreview) { themePreview = false; themeChanged(); }
  if (focusButton) $('themeMenuBtn').focus();
  return true;
}
// Escape inside the menu (also from a focused native color input) closes only the menu.
$('themeMenu').addEventListener('keydown', ev => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); closeThemeMenu(true); } });
$('themeMenuBtn').addEventListener('click', ev => { ev.stopPropagation(); $('thsel').classList.contains('open') ? closeThemeMenu() : openThemeMenu(); });
document.addEventListener('pointerdown', ev => { if (!$('thsel').contains(ev.target)) closeThemeMenu(); });
document.addEventListener('click', ev => { if (!$('thsel').contains(ev.target) && ev.target.isConnected) closeThemeMenu(); });
// Clicks in a report frame never reach this document: focus moving into it closes the menu.
addEventListener('blur', () => setTimeout(() => { if (document.activeElement?.tagName === 'IFRAME') closeThemeMenu(); }, 0));

let liveTimer = null;
function applyLive() {
  $('live').classList.toggle('on', state.live);
  $('liveText').textContent = state.live ? t('Live · 5 s') : t('Live off');
  clearInterval(liveTimer);
  if (state.live) liveTimer = setInterval(() => { if (!document.hidden) load({ quiet: true }); }, 5000);
}
$('liveBtn').addEventListener('click', () => { state.live = !state.live; persist(); applyLive(); });
$('refreshBtn').addEventListener('click', () => load());

document.addEventListener('keydown', ev => {
  const typing = isTypingIn(document.activeElement);
  if (ev.key === '/' && !typing) { ev.preventDefault(); F.text.focus(); }
  else if (ev.key === 'Escape') { if (closeThemeMenu(true)) { ev.preventDefault(); return; } closeDbMenu(); if (typing) document.activeElement.blur(); else if (state.open) { state.open = null; render(); } else if (state.tab === 'schema' && graph3d) graph3d.showAll(); }
  else if (!typing && (ev.key === 'r' || ev.key === 'R') && !ev.ctrlKey && !ev.metaKey) load();
  else if (!typing && (ev.key === 'd' || ev.key === 'D') && !ev.ctrlKey && !ev.metaKey) { $('dbsel').classList.contains('open') ? closeDbMenu() : openDbMenu(); }
  else if (!typing && ['1', '2', '3', '4', '5', '6'].includes(ev.key)) switchTab(tabNames[Number(ev.key) - 1]);
});
addEventListener('resize', moveInk);
addEventListener('scroll', hideTip, { passive: true });

// ---------- start ----------
state.memExpand = roleMigrated(state.memExpand);
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.v)));
applyStaticI18n();
applyTheme();
syncRangeButtons();
applyLive();
switchTab(state.tab || 'overview');
load();
</script>
</body>
</html>
