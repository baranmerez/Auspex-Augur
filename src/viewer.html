<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #fcfcfb; --surface-2: #f0f1f3; --line: #e3e5e9; --line-strong: #d3d6dc;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
    --accent: #2a78d6; --accent-soft: #e6f0fc; --accent-ink: #1c5cab;
    --series-1: #2a78d6; --series-2: #eb6834;
    --good: #0ca30c; --good-ink: #006300; --good-soft: #e6f6e6;
    --critical: #d03b3b; --critical-soft: #fbeaea;
    --warn-soft: #fff4dc; --warn-ink: #8a5a00;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, .16);
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --radius: 10px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    /* Relation roles around a center table (Graph, ER diagram, Flow), each
       token in one place as light-dark(light theme, dark theme). Rank 1 uses
       -1 (strongest), rank 10 uses -10 (faintest), ranks between are mixed. */
    --role-ref-1: light-dark(#0b4a9e, #8fc1ff); --role-ref-10: light-dark(#b4cff2, #2b4669);
    --role-dep-1: light-dark(#a33a05, #ffac70); --role-dep-10: light-dark(#f6cdb0, #6b3b1d);
    --role-other: light-dark(#a3a7ae, #5b5d61);
    --lane-ref: light-dark(#eef4fc, #16202d); --lane-center: light-dark(#f2f3f5, #1f1f1e); --lane-dep: light-dark(#fdf2ea, #261c15);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c2a; --line-strong: #3a3a37;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
      --accent: #3987e5; --accent-soft: #1b2b42; --accent-ink: #86b6ef;
      --series-1: #3987e5; --series-2: #d95926;
      --good-ink: #4cc76a; --good-soft: #15301c; --critical-soft: #3a1a1a; --warn-soft: #362a12; --warn-ink: #f0b64a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c2a; --line-strong: #3a3a37;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #1b2b42; --accent-ink: #86b6ef;
    --series-1: #3987e5; --series-2: #d95926;
    --good-ink: #4cc76a; --good-soft: #15301c; --critical-soft: #3a1a1a; --warn-soft: #362a12; --warn-ink: #f0b64a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* Header */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .top-inner { padding: 12px 24px 0; }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { width: 30px; height: 30px; flex: none; border-radius: 7px; }
  /* Decorative radar overlay clipped to the round screen of the app icon
     (centre 49.6% / 48.4%, radius about 22% of the icon). CSS only. */
  .logo-box { position: relative; display: inline-block; width: 30px; height: 30px; flex: none; }
  .logo-box .logo { display: block; }
  .logo-radar { position: absolute; left: 27.6%; top: 26.4%; width: 44%; height: 44%; border-radius: 50%; overflow: hidden; pointer-events: none; }
  .logo-radar .sweep { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, color-mix(in srgb, var(--accent) 38%, transparent) 350deg, color-mix(in srgb, var(--accent) 70%, transparent) 360deg);
    animation: radarSpin 4s linear infinite; }
  .logo-radar .sweep::after { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 50%; margin-left: -.5px; background: var(--accent); opacity: .9; }
  .logo-radar .blip { position: absolute; width: 2px; height: 2px; margin: -1px 0 0 -1px; border-radius: 50%; background: var(--series-2); opacity: .2;
    animation: radarBlip 4s linear infinite; animation-delay: var(--d); }
  .logo-radar .blip.b2 { background: var(--accent); }
  @keyframes radarSpin { to { transform: rotate(360deg); } }
  @keyframes radarBlip { 0% { opacity: 1; transform: scale(1.6); } 40% { opacity: .2; transform: scale(1); } 100% { opacity: .2; transform: scale(1); } }
  html.page-hidden .logo-radar .sweep, html.page-hidden .logo-radar .blip { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .logo-radar .sweep { animation: none; transform: rotate(50deg); }
    .logo-radar .blip { animation: none; opacity: .7; }
  }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .brand .sub { color: var(--text-3); font-size: 13px; }
  .brand .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2);
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); position: relative; }
  .live.on .dot { background: var(--good); }
  .live.on .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--good);
    animation: pulse 1.8s var(--ease) infinite; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--text-2); transition: background .15s, border-color .15s; }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--text-2); transition: background .15s, color .15s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }

  /* On narrow widths the tab row scrolls inside itself, never the page. */
  nav.tabs { display: flex; gap: 2px; margin-top: 10px; position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: none; white-space: nowrap; border: 0; background: none; padding: 10px 14px; color: var(--text-2); font-weight: 500; position: relative; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.on { color: var(--text); }
  nav.tabs .count { font-size: 11px; color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tab-ink { position: absolute; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; transition: left .3s var(--ease), width .3s var(--ease); }

  /* Full width; the page is the only vertical scroller. Side panels below the
     sticky header use --sticky-top and keep their own max-height. */
  main { padding: 16px 24px 60px; }
  :root { --sticky-top: 130px; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .field { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 0 8px; height: 32px; transition: border-color .15s; }
  .field:focus-within { border-color: var(--accent); }
  .field label { font-size: 12px; color: var(--text-3); }
  .field select, .field input { border: 0; background: none; outline: none; height: 30px; font-size: 13px; }
  .field input[type=date] { width: 128px; }
  .search { flex: 1; min-width: 220px; max-width: 420px; }
  .search input { width: 100%; }
  .search kbd { font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; margin-bottom: 14px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 4px 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-ink); animation: pop .25s var(--ease); }
  .chip button { border: 0; background: none; color: inherit; width: 18px; height: 18px; border-radius: 50%; line-height: 1; }
  .chip button:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .chips .clear { border: 0; background: none; color: var(--text-3); font-size: 12px; text-decoration: underline; }
  .chips .scope { font-size: 12px; color: var(--text-3); }

  /* Panels */
  .panel { background: var(--panel-bg, var(--surface)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  /* Glass theme (class "glass" on <html>): translucent panels with a backdrop
     blur over a soft multi-color page background. Blur sits on panel containers
     only, never on rows of long lists. "glass-flat" (no backdrop-filter, or
     reduced transparency requested) keeps the panels opaque and the page flat. */
  :root.glass:not(.glass-flat) { --panel-bg: var(--glass-bg); }
  :root.glass:not(.glass-flat) body { background: var(--bg); min-height: 100vh; }
  :root.glass:not(.glass-flat) body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--page-bg); pointer-events: none; }
  :root.glass:not(.glass-flat) .panel { border-color: var(--glass-line); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat, 1.5)); backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat, 1.5)); }
  :root.glass :focus-visible { box-shadow: 0 0 0 4px var(--surface); }
  .panel-h { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 0; }
  .panel-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-h .hint { color: var(--text-3); font-size: 12px; }
  .panel-h .grow { flex: 1; }
  .panel-b { padding: 12px 16px 16px; }
  .grid { display: grid; gap: 14px; }
  .g-tiles { grid-template-columns: 1.4fr repeat(5, 1fr); }
  .g-2 { grid-template-columns: 1fr 1fr; }
  .g-main { grid-template-columns: 2fr 1fr; }
  .stack > * + * { margin-top: 14px; }

  .tile { padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -.3px; }
  .tile .d { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .tile.hero .v { font-size: 48px; line-height: 1.05; letter-spacing: -1px; }
  .tile .v.bad { color: var(--critical); }
  .status-ico { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* Charts */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .grid-line { stroke: var(--line); stroke-width: 1; }
  .chart .axis-text { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .bar { transition: opacity .15s, transform .7s var(--ease); }
  .chart .bar.grow-y { transform: scaleY(0); }
  .chart .bar.grow-x { transform: scaleX(0); }
  .chart.ready .bar.grow-y, .chart.ready .bar.grow-x { transform: none; }
  .chart .hit { fill: transparent; }
  .chart .hit:hover + .bar, .chart .col:hover .bar { opacity: .82; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .hbars { display: grid; grid-template-columns: minmax(90px, max-content) 1fr auto; gap: 7px 10px; align-items: center; font-size: 13px; }
  .hbars .lbl { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .hbars .track { height: 14px; position: relative; }
  .hbars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 4px 4px 0;
    transform-origin: left; transform: scaleX(0); transition: transform .7s var(--ease), opacity .15s; }
  .ready .hbars .fill { transform: scaleX(1); }
  .hbars .row:hover .fill, .hbars .fill:hover { opacity: .82; }
  .hbars .val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; text-align: right; }
  .hbars .sub { color: var(--text-3); font-weight: 400; margin-left: 6px; }
  .hbars .row { display: contents; cursor: pointer; }

  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 8px; box-shadow: var(--shadow-lg); padding: 8px 10px; font-size: 12px; min-width: 140px;
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }

  /* Lists */
  .mini { list-style: none; margin: 0; padding: 0; }

  /* Table */

  .detail { padding: 14px 16px; animation: open .25s var(--ease); }

  .detail .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 16px; margin: 10px 0; font-size: 12px; }
  .detail .meta span { color: var(--text-3); }

  .error-box { background: var(--critical-soft); color: var(--critical); padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; color: var(--text-2); }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }

  /* Profiles */
  .profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .pcard { padding: 16px; transition: transform .2s var(--ease), box-shadow .2s; animation: rise .4s var(--ease) both; }
  .pcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

  .pcard .stats span { font-size: 11px; color: var(--text-3); }

  .pcard dt { color: var(--text-3); }

  .paths { margin-top: 18px; font: 12px var(--mono); color: var(--text-3); }
  .paths div { margin: 3px 0; }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-3); }
  .empty svg { width: 42px; height: 42px; opacity: .5; display: block; margin: 0 auto 8px; }
  .muted { color: var(--text-3); }
  .view { animation: fade .3s var(--ease); }

  /* Database switcher */
  .dbsel { position: relative; }
  .dbsel > button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface);
    border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 13px; transition: border-color .15s, box-shadow .15s; }
  .dbsel > button:hover, .dbsel.open > button { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .dbsel .lbl { color: var(--text-3); font-size: 12px; }
  .dbsel .val { font-weight: 650; }
  .dbsel .caret { color: var(--text-3); transition: transform .2s var(--ease); }

  .db-ico { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .dbmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 300px; max-width: 380px; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; display: none; animation: pop .18s var(--ease); }

    border: 0; background: none; border-radius: 8px; padding: 8px 10px; }
  .dbmenu button:hover { background: var(--surface-2); }
  .dbmenu button.on { background: var(--accent-soft); }
  .dbmenu .n { font-weight: 600; }
  .dbmenu .d { grid-column: 2 / 4; font-size: 12px; color: var(--text-3); }
  .dbmenu .c { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .dbmenu .chk { color: var(--accent); font-weight: 700; }
  .dbmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  .thsel { position: relative; }
  #themeMenuBtn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .thmenu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; width: 340px; max-width: calc(100vw - 24px); max-height: calc(100vh - 80px); overflow: auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 8px 10px 10px; display: none; animation: pop .18s var(--ease); }
  .thsel.open .thmenu { display: block; }
  .th-h { font-size: 11px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); margin: 8px 2px 4px; }
  .th-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .th-item { display: flex; align-items: center; border-radius: 8px; border: 1px solid transparent; }
  .th-item.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .th-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 6px; border-radius: 8px; text-align: left; font-size: 13px; color: var(--text); }
  .th-pick span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .th-pick:hover { background: var(--surface-2); }
  .th-sw { width: 26px; height: 18px; border-radius: 5px; border: 1px solid; display: inline-flex; align-items: center; justify-content: center; gap: 3px; flex: none; }
  .th-sw i { width: 6px; height: 6px; border-radius: 50%; }
  .th-list.one { grid-template-columns: 1fr; }
  .th-act { border: 0; background: none; color: var(--text-3); width: 24px; height: 24px; border-radius: 6px; flex: none; padding: 0; line-height: 1; }
  .th-act:hover { background: var(--surface-2); color: var(--text); }
  .th-act.del:hover { background: var(--critical-soft); color: var(--critical); }
  :root.mono-heads h1, :root.mono-heads h2, :root.mono-heads h3, :root.mono-heads .th-h { font-family: var(--mono); letter-spacing: 0; }
  /* Theme studio: a modal dialog, so the native color picker never closes it. On wide screens it sits
     at the right edge and the page behind (the live preview) stays visible. */
  .dlg.th-studio { width: min(920px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; overflow: hidden; margin: auto; }
  .dlg.th-studio[open] { display: flex; flex-direction: column; }
  @media (min-width: 1200px) { .dlg.th-studio { margin: 12px 12px 12px auto; } }
  .dlg.th-studio::backdrop { background: rgba(0, 0, 0, .12); }
  .th-s-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 6px; }
  .th-s-head h3 { margin: 0; }
  .th-s-top { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
  .th-name { display: grid; gap: 2px; font-size: 12px; color: var(--text-2); flex: 1; min-width: 180px; }
  .th-s-top input[type=text], .th-s-top select { height: 30px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 8px; min-width: 0; }
  .th-s-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 12px; }
  .th-s-foot { border-top: 1px solid var(--line); padding: 6px 16px 12px; }
  .th-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); gap: 16px; align-items: start; }
  .th-right { position: sticky; top: 0; }
  @media (max-width: 760px) { .th-cols { grid-template-columns: minmax(0, 1fr); } .th-right { position: static; } .dlg.th-studio { max-height: calc(100vh - 12px); } }
  .th-fs { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0 0; padding: 4px 10px 10px; min-width: 0; }
  .th-fs legend { font-size: 11px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); padding: 0 4px; }
  .th-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 14px; }
  .th-tok { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-2); min-width: 0; }
  .th-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .th-ctl { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .th-ctl input[type=color] { width: 36px; height: 26px; padding: 0 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
  .th-hex { width: 86px; height: 26px; font: 12px var(--mono); border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text); padding: 0 6px; }
  .th-hex[aria-invalid="true"] { border-color: var(--critical); }

  .th-chk { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-top: 8px; grid-column: 1 / -1; }
  .th-rng { display: grid; grid-template-columns: 80px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); grid-column: 1 / -1; margin-top: 6px; }
  .th-tabs { margin-top: 8px; }
  .th-ct { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .th-ct th { text-align: left; color: var(--text-3); font-weight: 600; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  .th-ct td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }

  .th-aa { display: inline-block; min-width: 28px; text-align: center; border: 1px solid var(--line-strong); border-radius: 4px; font-weight: 700; padding: 0 3px; }
  .th-grade { font-weight: 600; white-space: nowrap; }
  .th-grade.ok { color: var(--good-ink); } .th-grade.bad { color: var(--critical); }
  .icon-btn[hidden] { display: none; }
  .th-foot-row { align-items: center; } .th-foot-row .grow { flex: 1; }
  .th-empty { font-size: 12px; color: var(--text-3); padding: 2px; }
  .th-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .th-row input[type=text] { flex: 1; min-width: 120px; height: 30px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 8px; }
  .th-row .badge { white-space: normal; }
  .th-ok { background: var(--good-soft); color: var(--good-ink); }
  .th-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .th-msg { font-size: 12px; color: var(--text-2); min-height: 1em; margin-top: 4px; }
  .th-io { margin-top: 6px; font-size: 12px; }
  .th-io summary { cursor: pointer; color: var(--text-2); }
  .th-io textarea { width: 100%; margin-top: 6px; font: 11px/1.4 var(--mono); border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); color: var(--text); padding: 6px; resize: vertical; }
  .icon-btn.primary { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--on-accent, var(--surface)); }
  .icon-btn.secondary-danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, var(--line)); background: var(--surface); }
  .icon-btn.secondary-danger:hover { background: var(--critical-soft); color: var(--critical); border-color: var(--critical); }
  .icon-btn.primary:hover { background: var(--text); border-color: var(--text); color: var(--surface); }

  /* Toolbar */
  .toolbar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 10px 12px; display: grid; gap: 8px; margin-bottom: 10px; }
  .toolbar .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .toolbar[data-mode="reports"] .when, .toolbar[data-mode="reports"] .opsonly,
  .toolbar[data-mode="profiles"] .when, .toolbar[data-mode="profiles"] .opsonly { display: none; }
  .toolbar[data-mode="profiles"], .toolbar[data-mode="rules"], .toolbar[data-mode="views"], .toolbar[data-mode="functions"] { display: none; }
  .field select { background: transparent; color: var(--text); cursor: pointer; }
  select option { background: var(--surface); color: var(--text); }

  /* Reports */
  .rep { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .rep-list { max-height: calc(100vh - var(--sticky-top) - 20px); overflow: auto; position: sticky; top: var(--sticky-top); }
  .rep-filter { flex: 1 1 100%; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
  .rep-filter:focus { border-color: var(--accent); }
  .rep-list .stagebar .seg { flex: 1 1 0; min-width: 0; flex-wrap: wrap; }
  .rep-list .stagebar > .icon-btn { flex: none; align-self: flex-start; }

  .rep.collapsed { grid-template-columns: auto minmax(0, 1fr); }
  .rep-rail { position: sticky; top: var(--sticky-top); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 6px; }
  .rep-rail .rail-label { writing-mode: vertical-rl; font-size: 12px; color: var(--text-3); white-space: nowrap; }
  @media (max-width: 900px) { .rep.collapsed { grid-template-columns: 1fr; } .rep-rail { position: static; flex-direction: row; justify-content: flex-start; } .rep-rail .rail-label { writing-mode: horizontal-tb; } }
  .rep-group { padding: 8px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); }
  .rep-group .path { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text-2); }
  .rep-node { display: flex; width: 100%; align-items: center; gap: 6px; border: 0; background: none; text-align: left; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
  .rep-node:hover { background: var(--surface-2); }
  .rep-node:focus-visible, .rep-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rep-node .tw { flex: none; width: 12px; color: var(--text-3); transition: transform .15s; }
  .rep-node[aria-expanded="true"] .tw { transform: rotate(90deg); }
  .rep-node .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rep-node.has-sel .lbl { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .rep-node .tw { transition: none; } }
  .rep-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px 8px 14px; border-left: 3px solid transparent;
    transition: background .15s, border-color .15s; }
  .rep-item:hover { background: var(--surface-2); }
  .rep-item.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .rep-item .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .rep-item .s { font-size: 12px; color: var(--text-3); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .rep-row { position: relative; }
  .rep-row .rep-item { padding-right: 36px; }
  .rep-star { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--text-3);
    font-size: 15px; line-height: 1; cursor: pointer; opacity: .45; }
  .rep-row:hover .rep-star, .rep-star:focus-visible, .rep-star.on { opacity: 1; }
  .rep-star.on { color: var(--accent); }
  .rep-star:hover { background: var(--surface-2); }
  .rep-star:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rep-sec { border-bottom: 1px solid var(--line); }
  .rep-sec > summary { padding: 8px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); cursor: pointer; }
  .rep-sec > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rep-sec .rep-empty-line { padding: 2px 14px 8px; font-size: 12px; color: var(--text-3); }
  .rep-view .rep-meta { display: flex; gap: 4px 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .rep-view .rep-meta .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--text-2); overflow-wrap: anywhere; }
  .rep-view .rep-meta .chip.on { border-color: var(--accent); color: var(--accent-ink); }
  .rep-view .rep-meta .chip.stale { border-style: dashed; color: var(--text-3); text-decoration: line-through; }
  .rep-view .rep-title .rep-star { position: static; opacity: 1; }
  .badge.draft { background: var(--warn-soft); color: var(--warn-ink); }
  .badge.approved { background: var(--good-soft); color: var(--good-ink); }
  .badge.execute { background: var(--critical-soft); color: var(--critical); }
  .badge.sched-ok { background: var(--good-soft); color: var(--good-ink); }
  .badge.sched-skipped { background: var(--warn-soft); color: var(--warn-ink); }
  .badge.sched-failed { background: var(--critical-soft); color: var(--critical); }
  .badge.sched-none { background: var(--surface-2); color: var(--text-3); }
  .rep-trend { padding: 4px 12px 10px; border-bottom: 1px solid var(--line); }
  .rep-trend .tr-h { font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); margin: 4px 0; }
  .rep-trend .tr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; }
  .rep-trend .tr-name { font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; display: flex; justify-content: space-between; gap: 8px; }

  const want = [data.nodes.find(n => n.id === centerId), ...drawn.map(g => g.node)]

    erSvg(data, centerId, recs, roles, wrap.clientWidth || 1000),

}

function erSvg(data, centerId, recs, roles, width) {
  const center = data.nodes.find(n => n.id === centerId);
  // Column tags come from every relation of the center, drawn or not.
  const { cols, keyCols, tagsOf } = centerColumns(data, centerId, recs.get(centerId));
  let shown = state.memErAll ? cols : keyCols.length ? keyCols : cols.slice(0, 12);
  const hidden = cols.length - shown.length;
  const more = hidden > 0 ? t('+{n} more columns', { n: fmt(hidden) }) : state.memErAll && keyCols.length < cols.length ? t('Show key columns only') : null;

  const W = Math.max(width - 2, 2 * ER.nbw + ER.cw + 160);
  const cx = Math.round((W - ER.cw) / 2), lx = ER.m, rx = W - ER.m - ER.nbw;
  const rowY = (y, top, i) => y + top + i * ER.row + ER.row / 2 - 1;
  const boxes = [];
  let ly = ER.m, ry = ER.m, i = 0;
  for (const role of ['ref', 'dep']) {
    for (const gr of roles[role].slice(0, roleLimit('er', role))) {
      const left = role === 'ref';
      const x = left ? lx : rx, y = left ? ly : ry;
      const bcols = [...new Set(gr.links.flatMap(l => l.nbCols))];
      const types = new Map((recs.get(gr.id)?.columns || []).map(c => [c.name, c.type]));
      const box = erBox({ x, y, w: ER.nbw, title: gr.id, st: gr.node?.state, delay: reduceMotion ? 0 : Math.min(i++ * 25, 900),
        stripe: roleColor(role, gr.rank), metaOff: !gr.explored, outside: outsideScope(data, gr.id),
        meta: `#${gr.rank} · ${roleFigure(gr)} · ${stateLabel(gr.node?.state || 'unexplored')}`,
        rows: bcols.map(c => ({ name: c, type: types.get(c) || '' })) });
      boxes.push({ ...gr, box, bcols, x, y });
      if (left) ly += box.hgt + ER.gap; else ry += box.hgt + ER.gap;
    }
  }
  const centerBox = erBox({
    x: cx, y: ER.m, w: ER.cw, title: centerId, st: center?.state, center: true, more,
    note: rowEstimate(center) !== null ? `~${compact(rowEstimate(center))} ${t('rows')}` : null,
    rows: shown.map(c => ({ name: c.name, type: c.type, tags: tagsOf(c.name) })),
  });
  const H = Math.max(ly, ry, ER.m + centerBox.hgt + ER.m) + ER.m;
  const root = svg('svg', { class: 'er', width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const linkLayer = svg('g'), boxLayer = svg('g');
  root.append(linkLayer, boxLayer);
  const centerRows = shown.map(c => c.name);
  for (const b of boxes) {
    b.box.g.dataset.id = b.id;
    boxLayer.append(b.box.g);
    for (const l of b.links) {
      for (let k = 0; k < Math.max(l.centerCols.length, l.nbCols.length, 1); k++) {
        const ci = centerRows.indexOf(l.centerCols[k] ?? l.centerCols[0]);
        const cyA = ci >= 0 ? rowY(ER.m, centerBox.top, ci) : ER.m + ER.head / 2;
        const ny = rowY(b.y, b.box.top, Math.max(0, b.bcols.indexOf(l.nbCols[k] ?? l.nbCols[0])));
        const [x1, y1, x2, y2] = b.role === 'ref' ? [b.x + ER.nbw, ny, cx, cyA] : [cx + ER.cw, cyA, b.x, ny];
        linkLayer.append(svg('path', { class: 'er-link fk role', 'data-id': b.id, style: `stroke:${roleColor(b.role, b.rank)}`,
          d: `M${x1},${y1} C${x1 + 70},${y1} ${x2 - 70},${y2} ${x2},${y2}` }));
      }
    }
  }
  boxLayer.append(centerBox.g);
  root.addEventListener('mouseover', ev => {
    const id = ev.target.closest('.er-box')?.dataset.id || null;
    root.classList.toggle('hovering', !!id);
    root.querySelectorAll('.er-box, .er-link').forEach(el => el.classList.toggle('hot', !!id && el.dataset.id === id));
  });
  root.addEventListener('mouseleave', () => { root.classList.remove('hovering'); });
  root.addEventListener('click', ev => {
    if (ev.target.dataset?.more) { state.memErAll = !state.memErAll; renderSchema(); return; }
    const id = ev.target.closest('.er-box')?.dataset.id;
    if (id) { setMemSel(id); state.memErAll = false; renderSchema(); }
  });
  return root;
}

// ---------- Flow view ----------
// Reference -> Center -> Dependent swimlanes; a Dependent can open its own
// dependents as one more lane (depth 2). Clicking a table makes it the center;
// the trail above leads back. Pure HTML cards over an SVG edge layer.
// The center card sits in the Merkez lane: name, state, row estimate, column

}

  state.memFlowOpen = null;
  state.memFlowCenter = id;
  setMemSel(id);
  renderSchema();
}
function flowLanes(data, centerId) {
  const roles = roleGroups(data, centerId);
  const center = data.nodes.find(n => n.id === centerId) || { id: centerId, state: 'unexplored' };
  const lanes = [
    { key: 'ref', role: 'ref', bg: 'ref', title: roleName('ref'), all: roles.ref },
    { key: 'center', bg: 'center', title: t('Center'), all: [{ id: centerId, node: center, center: true }] },
    { key: 'dep', role: 'dep', bg: 'dep', title: roleName('dep'), all: roles.dep },

  for (const l of lanes) l.items = l.key === 'center' ? l.all : l.all.slice(0, roleLimit('flow', l.key));
  const open = state.memFlowOpen;

    lanes.push({ key: 'dep2', role: 'dep', bg: 'dep', title: t('Dependents of {t}', { t: tableOf(open, data.nodes.find(n => n.id === open)) }), tip: t('Dependents of {t}', { t: open }),
      all, items: all.slice(0, roleLimit('flow', 'dep2')), parent: open });

}

function flowCenterCard(data, centerId, rec) {
  const node = data.nodes.find(n => n.id === centerId) || { id: centerId, state: 'unexplored' };
  const { cols, keyCols, tagsOf, pk, notes } = centerColumns(data, centerId, rec);
  const pick = keyCols.length ? keyCols : cols;

  const facts = [est !== null ? `~${compact(est)} ${t('rows')}` : t('no estimate'),
    nCols ? t('{n} columns', { n: fmt(nCols) }) : null, t('{n} notes', { n: fmt(notes.length) })].filter(Boolean).join(' · ');
  const hgt = FL.cTop + Math.max(1, shown.length + (more > 0 ? 1 : 0)) * FL.cRow + FL.cBottom;
  const el = h('div', { class: `fl-node center fl-center ${st}`, 'data-id': centerId, title: centerId },
    h('div', { class: 'fl-c' },

      h('div', { class: 'mt' }, facts),

      h('div', { class: 'fl-cols' },
        shown.length ? shown.map(c => h('div', { class: 'fl-col', title: c.type ? `${c.name} · ${c.type}` : c.name },
          h('span', { class: 'cn' }, c.name), h('span', { class: 'tg' }, tagsOf(c.name).join(' '))))

async function buildFlow(wrap, data, centerId, key) {
  if (state.memFlowCenter !== centerId) { state.memFlowTrail = []; state.memFlowOpen = null; state.memFlowCenter = centerId; }
  const cNode = data.nodes.find(n => n.id === centerId);
  const rec = cNode?.file ? await memTable(state.db, cNode.file, data.generatedAt) : null;
  if (state.schemaKey !== key) return;
  const lanes = flowLanes(data, centerId);
  const n = lanes.length;
  const W = Math.max((wrap.clientWidth || 1000) - 2, n * FL.minLane);
  const laneW = W / n, nodeW = Math.min(FL.nodeMaxW, laneW - 36), cardW = Math.min(FL.cMaxW, laneW - 24);
  const card = flowCenterCard(data, centerId, rec);
  const rows = Math.max(1, ...lanes.filter(l => l.key !== 'center').map(l => l.items.length));
  const contentH = Math.max(rows * (FL.nodeH + FL.gap) - FL.gap, card.hgt);
  const top = FL.head + FL.pad;
  const H = top + contentH + FL.pad + FL.foot;
  const pos = new Map();
  const host = h('div', { class: 'flow', style: `width:${W}px;height:${H}px` });
  const edges = svg('svg', { class: 'fl-edges', width: W, height: H, viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
  host.append(edges);
  const depCount = id => roleGroups(data, id).dep.filter(x => x.id !== centerId).length;
  const parentOf = l => (l.key === 'dep2' ? l.parent : centerId);

  lanes.forEach((lane, li) => {
    const x0 = li * laneW;
    edges.append(svg('rect', { class: 'fl-lane-bg', x: x0 + 6, y: 6, width: laneW - 12, height: H - 12, rx: 12, style: `fill:var(--lane-${lane.bg})` }));
    const head = lane.key === 'center'
      ? h('div', { class: 'rh' }, h('b', {}, lane.title), h('span', {}, t('selected table')))
      : roleHeader('flow', lane.key, lane.all, lane.title, lane.bg);
    host.append(h('div', { class: 'fl-lane-h', title: lane.tip || null, style: `left:${x0 + 18}px;top:16px;width:${laneW - 36}px` }, head));
    if (lane.key === 'center') {
      const x = Math.round(x0 + (laneW - cardW) / 2);
      pos.set(centerId, { x, y: top, w: cardW, h: card.hgt });
      card.el.style.cssText = `left:${x}px;top:${top}px;width:${cardW}px;height:${card.hgt}px`;
      host.append(card.el);
      return;
    }
    const bh = lane.items.length * (FL.nodeH + FL.gap) - FL.gap;
    const parentY = lane.parent ? pos.get(lane.parent)?.y : null;
    // Lanes start at the top so one lane's top-N picker never moves
    // the cards of another lane; only the depth-2 lane follows its parent.
    const want = parentY !== null && parentY !== undefined ? parentY + FL.nodeH / 2 - bh / 2 : top;
    const y0 = Math.max(top, Math.min(top + contentH - bh, want));
    const x = Math.round(x0 + (laneW - nodeW) / 2);
    lane.items.forEach((it, i) => {
      const y = Math.round(y0 + i * (FL.nodeH + FL.gap));
      pos.set(lane.key === 'dep2' ? 'dep2|' + it.id : it.id, { x, y, w: nodeW, h: FL.nodeH });
      const st = it.node?.state || 'unexplored';
      const joins = joinLabels(it, parentOf(lane));
      const kids = lane.key === 'dep' ? depCount(it.id) : null;
      const isOpen = state.memFlowOpen === it.id && lane.key === 'dep';
      const expTip = kids ? t(isOpen ? 'Hide the dependents of {t}' : 'Open the dependents of {t} ({n} tables)', { t: it.id, n: fmt(kids) })
        : t('No further dependents of {t} are known', { t: it.id });
      host.append(h('div', { class: `fl-node ${st}${isOpen ? ' open' : ''}${outsideScope(data, it.id) ? ' outside' : ''}`, 'data-id': it.id,
        style: `left:${x}px;top:${y}px;width:${nodeW}px;height:${FL.nodeH}px;${reduceMotion ? '' : `animation-delay:${Math.min(li * 60 + i * 30, 600)}ms`}` },
        h('span', { class: 'bar', style: `background:${roleColor(it.role, it.rank)}` }),
        h('button', { class: 'main', title: `${it.id}\n${roleName(it.role)} #${it.rank} · ${roleFigure(it)}\n${joins.join('\n')}\n${t('Click to make it the center')}`,
          onclick: () => flowCenter(it.id) },
          h('span', { class: 'nm' }, it.id), h('span', { class: 'mt' }, `#${it.rank} · ${roleFigure(it)} · ${stateLabel(st)}`),
          h('span', { class: 'jn' }, joins[0] || '', joins.length > 1 ? ` +${joins.length - 1}` : '')),
        kids !== null ? h('button', { class: 'exp', disabled: kids ? null : true, 'aria-expanded': kids ? String(isOpen) : null, title: expTip, 'aria-label': expTip,
          onclick: () => { state.memFlowOpen = isOpen ? null : it.id; renderSchema(); } },
          h('span', { class: 'n' }, kids ? `${fmt(kids)} ›` : '–'), h('span', { class: 'l' }, kids ? t('dependents') : t('none further'))) : null));
    });
  });

  // Edges run left to right: Reference -> Center -> Dependent -> its dependents.
  // At the center card an edge meets the row of its joined column when that
  // column is listed, else the card head.
  const c = pos.get(centerId);
  const atCenter = (cols, k, count) => {
    const i = card.names.indexOf(cols?.[0]);
    if (i >= 0) return c.y + FL.cTop + i * FL.cRow + FL.cRow / 2;
    return c.y + 14 + (count > 1 ? (k / (count - 1)) * 36 : 18);
  };
  const spreadOn = (b, k, count) => b.y + (count > 1 ? 10 + (k / (count - 1)) * (b.h - 20) : b.h / 2);
  const link = (a, b, y1, y2, it, from, to) => {
    const x1 = a.x + a.w, x2 = b.x;
    const dx = Math.max(30, (x2 - x1) / 2);
    const p = svg('path', { class: 'fl-edge', 'data-a': from, 'data-b': to, d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`,
      style: `stroke:${roleColor(it.role, it.rank)};stroke-width:${flowWidth(it.weight, it.max).toFixed(2)}` });
    const tt = svg('title');

      const me = pos.get(lane.key === 'dep2' ? 'dep2|' + it.id : it.id);
      const it2 = { ...it, max, joins: joinLabels(it, parentOf(lane)) };

      const cy = atCenter(it.links[0]?.centerCols, k, lane.items.length);
      if (lane.key === 'ref') link(me, c, mid, cy, it2, it.id, centerId);
      else if (lane.key === 'dep') link(c, me, cy, mid, it2, centerId, it.id);

    });
  }
  host.addEventListener('mouseover', ev => {
    const id = ev.target.closest('.fl-node')?.dataset.id || null;
    host.classList.toggle('hovering', !!id);
    const near = new Set(id ? [id] : []);
    host.querySelectorAll('.fl-edge').forEach(el => {
      const on = !!id && (el.dataset.a === id || el.dataset.b === id);
      el.classList.toggle('hot', on);
      if (on) { near.add(el.dataset.a); near.add(el.dataset.b); }
    });
    host.querySelectorAll('.fl-node').forEach(el => el.classList.toggle('hot', near.has(el.dataset.id)));
  });
  host.addEventListener('mouseleave', () => host.classList.remove('hovering'));

  const trail = state.memFlowTrail || [];
  wrap.replaceChildren(
    h('div', { class: 'flow-trail' },
      h('button', { class: 'icon-btn sm', disabled: trail.length ? null : true, onclick: () => flowBack(trail.length - 1) }, '‹ ', t('Back')),
      trail.map((id, i) => [h('button', { class: 'crumb', title: id, onclick: () => flowBack(i) }, id), '›']),
      h('span', { class: 'crumb cur', title: centerId }, centerId)),
    host,
    h('div', { class: 'flow-foot' }, roleLegend(false), h('span', {}, t('Edge width: linked rows, log scale (estimated)')),
      h('span', {}, t('PK, FK: keys · U: used in a plan · N: has a note · ←: referenced')), h('span', {}, t('Click a table to make it the center'))));
}

// ---------- rules tab ----------
// rules-list:start (tests/viewerRules.test.js runs this block with report-filter)
// The Rules tab lists every schema-memory note of one database (graph.json:
// rules, observations and inferences, active and archived). Filters: kind,
// table (part of schema.table), status (active by default) and text; text
// and table match like the report filter (case-insensitive, Turkish İ/I/ı/i).
const ruleKinds = ['rule', 'observation', 'inference'];
const ruleStatuses = ['active', 'archived', 'all'];
const ruleTarget = n => (n.table ? tableKey(n.schema, n.table) : '');
function ruleMatches(n, f = {}) {
  const status = ruleStatuses.includes(f.status) ? f.status : 'active';
  if (status !== 'all' && (status === 'active') !== (n.status === 'active')) return false;
  if (f.kind && n.kind !== f.kind) return false;
  const tq = foldText(f.table).trim();
  if (tq && !foldText(ruleTarget(n)).includes(tq)) return false;
  const words = foldText(f.q).split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const hay = foldText([n.text, n.column, ruleTarget(n), n.archivedReason, `#${n.id}`].join(' '));
  return words.every(w => hay.includes(w));
}
const ruleKindOrder = { rule: 0, observation: 1, inference: 2 };
// Database-wide notes first, then by table, kind and id.
const ruleSort = (a, b) => (a.table ? 1 : 0) - (b.table ? 1 : 0) || ruleTarget(a).localeCompare(ruleTarget(b))
  || (a.column ? 1 : 0) - (b.column ? 1 : 0) || String(a.column || '').localeCompare(String(b.column || ''))
  || (ruleKindOrder[a.kind] ?? 3) - (ruleKindOrder[b.kind] ?? 3) || a.id - b.id;
const filterRules = (notes, f) => (Array.isArray(notes) ? notes : []).filter(n => ruleMatches(n, f)).sort(ruleSort);
// Groups of the filtered list, one per target ('' = database-wide), in order.
function groupRules(list) {
  const groups = [];
  for (const n of list) {
    const key = ruleTarget(n);
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, schema: n.table ? n.schema : null, table: n.table || null, notes: [] });
    groups[groups.length - 1].notes.push(n);
  }
  // Within a group: sub-groups per column ('' = table-level notes, first).
  for (const g of groups) {
    g.columns = [];
    for (const n of g.notes) {
      const col = n.column || '';
      if (!g.columns.length || g.columns[g.columns.length - 1].column !== col) g.columns.push({ column: col, notes: [] });
      g.columns[g.columns.length - 1].notes.push(n);
    }
  }
  return groups;
}
// Counts by kind of active notes, plus archived ones.
function ruleCounts(list) {
  const c = { rule: 0, observation: 0, inference: 0, archived: 0 };
  for (const n of Array.isArray(list) ? list : []) { if (n.status === 'active') c[n.kind] = (c[n.kind] || 0) + 1; else c.archived++; }
  return c;
}
// The box the Rules navigator shows: the user's pick while it still has
// notes ('' = database-wide), else the database-wide box when it has notes,
// else the first table ('' when there is nothing at all).
function pickRulesSel(sel, dbWideCount, tableKeys) {
  if (sel === '' && (dbWideCount || !tableKeys.length)) return '';
  if (sel && tableKeys.includes(sel)) return sel;
  return dbWideCount || !tableKeys.length ? '' : tableKeys[0];
}
// Width of the Rules navigator's table list (px), set with its divider.
const rulesSideMin = 220, rulesSideMax = 560, rulesSideDefault = 320;
// Rules navigator boxes per schema, then per name prefix (the part before the
// first "_"). A prefix shared by at least two tables is a group; the other
// tables share one group with prefix null, listed last. A schema with fewer
// than minTables tables stays one group.
function groupRuleTables(tables, minTables = 10) {
  // Insertion-ordered grouping (Map.groupBy needs Node 21+; tests run on Node 20).
  const groupBy = (items, keyOf) => {
    const m = new Map();
    for (const it of items) { const k = keyOf(it); if (m.has(k)) m.get(k).push(it); else m.set(k, [it]); }
    return m;
  };
  const out = [];
  for (const [schema, list] of groupBy(tables, g => String(g.schema))) {
    if (list.length < minTables) { out.push({ schema, count: list.length, groups: [{ prefix: null, tables: list }] }); continue; }
    const groups = [];
    const rest = [];
    for (const [prefix, gs] of groupBy(list, g => String(g.table).split('_')[0])) {
      if (gs.length > 1) groups.push({ prefix, tables: gs }); else rest.push(...gs);
    }
    groups.sort((a, b) => a.prefix.localeCompare(b.prefix));
    if (rest.length) groups.push({ prefix: null, tables: rest });
    out.push({ schema, count: list.length, groups });
  }

}
// "13 Oct 2026" / "13 Eki 2026": a day without time of day.
const ruleDay = (ts, loc) => {
  const d = ts ? new Date(ts) : null;
  return d && !Number.isNaN(d.getTime()) ? d.toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' }) : '?';
};
// A plain "2026-10-19" asOf reads like the other days; other text stays as written.

    h('h3', { id: 'archiveDlgTitle' }, t('Archive this note?')),
    h('p', {}, t('The note stays in the schema memory as archived, with your reason, and is no longer given to your agent. Only local Auspex files change; no database is touched.')),
    h('dl', {}, facts.map(([label, v]) => [h('dt', {}, t(label)), h('dd', {}, v)])),
    h('label', { class: 'dlg-field', for: 'archiveReason' }, h('span', {}, t('Reason')), input),
    h('div', { class: 'dlg-hint' }, hint, count),
    h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'icon-btn', onclick: () => dlg.close('cancel') }, t('Cancel')), ok)));
  dlg.returnValue = '';
  dlg.onclose = () => { if (dlg.returnValue === 'ok') runArchiveNote(state.db, n, input.value); };
  dlg.showModal();
  input.focus();
}

async function runArchiveNote(profile, n, text) {
  if (state.archivePending || archiveReasonProblem(text)) return;
  const req = archiveRequest(profile, n, text);
  state.archivePending = n.id;
  renderRules();
  try {
    if (tauriCore) await invokeArchiveNote(tauriCore.invoke, req);
    else await postArchiveNote(fetch, pageToken, req);
    toast(t('Note archived'));
  } catch (err) {
    toast(err.viewerRestarted ? t('The viewer was restarted; reload the page') : err.setupText ? t(err.setupText) : err.message);
  } finally {
    state.archivePending = null;
    // Show the memory as it is now (also after an unknown outcome).
    try { state.memory = await getJson('/api/memory'); } catch {}
    state.memView = null;
    state.rulesKey = null;
    state.schemaKey = null;
    renderRules();
  }
}

  4: 'used regularly in many reports',
  3: 'appears in the reports of one topic',
  2: 'one report, or only in an old version',
  1: 'appears in no SQL',

const tpRoles = ['key', 'join', 'filter', 'display', 'aggregate', 'sort/group'];
const tpRoleTexts = {

const tpNoteAt = n => String(n?.confirmedAt ?? n?.createdAt ?? '');

  if (!rec || typeof rec !== 'object') throw new Error(`The ${what} file could not be read.`);

// A data dictionary of one database from the schema memory only (graph.json

// relations and active rules and observations, and database-wide rules and

// left out; observations keep their aggregate figures. No row values exist in

    .map(n => ({ id: n.id, kind: n.kind, schema: n.schema, table: n.table, column: n.column || null, text: n.text, asOf: n.asOf || null,
      figures: n.kind === 'observation' && n.evidence?.figures ? n.evidence.figures : null }));

    tb.structureMissing ? `<p class="warn">${dictEsc(tr('Structure not loaded: comment and key columns are missing.'))}</p>` : '',

function dictionaryMarkdown(model, tr = dictTr) {

  const section = (title, lines) => (lines.length ? [`### ${dictMd(title)}`, '', ...lines, ''] : []);
  const out = [`# ${dictMd(tr('Data dictionary: {db}', { db: model.profile }))}`, '',
    dictMd(tr('Generated {d} from the Auspex schema memory, without database access.', { d: `${day} UTC` })), '',
    dictMd(tr('Explored tables: {n}. Only active rules and observations are listed; unconfirmed inferences and archived notes are left out.', { n: model.tables.length })), ''];
  if (model.databaseNotes.length) out.push(`## ${dictMd(tr('Database-wide rules and observations'))}`, '', ...model.databaseNotes.map(noteLine), '');
  if (!model.tables.length) out.push(dictMd(tr('No explored tables yet.')), '');

    if (tb.structureMissing) out.push(`**${dictMd(tr('Structure not loaded: comment and key columns are missing.'))}**`, '');
    if (tb.comment) out.push(`**${dictMd(tr('Comment'))}:** ${dictMd(tb.comment)}`, '');
    out.push(...section(tr('Rules and observations'), tb.notes.map(noteLine)));
    if (tb.keyColumns.length) {
      out.push(`### ${dictMd(tr('Key columns'))}`, '', `| ${[tr('Column'), tr('Type'), tr('Tags'), tr('Comment')].map(cell).join(' | ')} |`, '| --- | --- | --- | --- |',
        ...tb.keyColumns.map(c => `| ${[c.name, `${c.type}${c.notNull ? ' NOT NULL' : ''}`, c.tags.join(', '), c.comment ?? ''].map(cell).join(' | ')} |`), '');
    }

// Builds the dictionary of the chosen database and downloads it. The table
// files load first (cached per memory version); when that took long enough
// for the click's user activation to expire, the next click downloads.
async function downloadDictionary(kind) {
  const db = state.db, data = state.memView?.profile === db ? state.memView.data : null;
  if (!db || !data) return;
  try {
    const explored = data.nodes.filter(n => n.state === 'explored' && n.file);
    const tables = new Map(await Promise.all(explored.map(async n => [n.id, await memTable(db, n.file, data.generatedAt)])));
    if (navigator.userActivation && !navigator.userActivation.isActive) { toast(t('The data dictionary is ready; click again to download')); return; }
    const now = new Date().toISOString();
    const model = dictionaryModel(data, tables, now);
    const text = kind === 'md' ? dictionaryMarkdown(model, t) : dictionaryHtml(model, t, lang);
    download(dictionaryFileName(db, now.slice(0, 10), kind), text, kind === 'md' ? 'text/markdown;charset=utf-8' : 'text/html;charset=utf-8');
    const missing = dictionaryMissing(model);
    if (missing) toast(t('Structure not loaded for {n} tables; they are marked in the data dictionary', { n: missing }));

        if (ev.shiftKey && (at === first || !dlg.contains(at))) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && (at === last || !dlg.contains(at))) { ev.preventDefault(); first.focus(); }
      }
    }
    ev.stopPropagation();
  });
}

let liveTimer = null;
function applyLive() {
  $('live').classList.toggle('on', state.live);
  $('liveText').textContent = state.live ? t('Live · 5 s') : t('Live off');
  clearInterval(liveTimer);
  if (state.live) liveTimer = setInterval(() => { if (!document.hidden) load({ quiet: true }); }, 5000);
}
$('liveBtn').addEventListener('click', () => { state.live = !state.live; persist(); applyLive(); });
$('refreshBtn').addEventListener('click', () => load());

document.addEventListener('keydown', ev => {
  const typing = isTypingIn(document.activeElement);
  if (ev.key === '/' && !typing) { ev.preventDefault(); (['schema', 'views', 'functions'].includes(state.tab) && $('tpSearch') || ['views', 'functions'].includes(state.tab) && $(`${state.tab}Search`) || F.text).focus(); }
  else if (ev.key === 'Escape') { if (closeThemeMenu(true)) { ev.preventDefault(); return; } closeDbMenu(); if (typing) document.activeElement.blur(); else if (state.open) { state.open = null; render(); } else if (state.tab === 'schema' && graph3d) graph3d.showAll(); }
  else if (!typing && (ev.key === 'r' || ev.key === 'R') && !ev.ctrlKey && !ev.metaKey) load();
  else if (!typing && (ev.key === 'd' || ev.key === 'D') && !ev.ctrlKey && !ev.metaKey) { $('dbsel').classList.contains('open') ? closeDbMenu() : openDbMenu(); }
  else if (!typing && ['1', '2', '3', '4', '5', '6', '7', '8', '9'].includes(ev.key)) switchTab(tabNames[Number(ev.key) - 1]);
});
addEventListener('resize', moveInk);
addEventListener('scroll', hideTip, { passive: true });

// ---------- start ----------
state.memExpand = roleMigrated(state.memExpand);
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.v)));
applyStaticI18n();
state.theme = themeDefaultId(state.theme);
applyTheme();
syncRangeButtons();
applyLive();
switchTab(state.tab || 'overview');
load();
</script>
</body>
