<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="img" aria-label="Section divider">
<title>Section divider</title>
<style>
.run { animation: run 5s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes run { 0% { transform: translateX(-20px); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(1220px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9A04F" stop-opacity="0"/><stop offset=".5" stop-color="#C9A04F" stop-opacity=".7"/><stop offset="1" stop-color="#C9A04F" stop-opacity="0"/></linearGradient>
<linearGradient id="dt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CFF9E" stop-opacity="0"/><stop offset="1" stop-color="#5CFF9E" stop-opacity=".9"/></linearGradient>
</defs>
<rect x="0" y="12.5" width="1200" height="1" fill="url(#dl)"/>
<g stroke="#C9A04F" stroke-opacity=".3" stroke-width="1"><line x1="40" y1="7" x2="40" y2="19"/><line x1="80" y1="10" x2="80" y2="16"/><line x1="120" y1="10" x2="120" y2="16"/><line x1="160" y1="10" x2="160" y2="16"/><line x1="200" y1="10" x2="200" y2="16"/><line x1="240" y1="7" x2="240" y2="19"/><line x1="280" y1="10" x2="280" y2="16"/><line x1="320" y1="10" x2="320" y2="16"/><line x1="360" y1="10" x2="360" y2="16"/><line x1="400" y1="10" x2="400" y2="16"/><line x1="440" y1="7" x2="440" y2="19"/><line x1="480" y1="10" x2="480" y2="16"/><line x1="520" y1="10" x2="520" y2="16"/><line x1="560" y1="10" x2="560" y2="16"/><line x1="600" y1="10" x2="600" y2="16"/><line x1="640" y1="7" x2="640" y2="19"/><line x1="680" y1="10" x2="680" y2="16"/><line x1="720" y1="10" x2="720" y2="16"/><line x1="760" y1="10" x2="760" y2="16"/><line x1="800" y1="10" x2="800" y2="16"/><line x1="840" y1="7" x2="840" y2="19"/><line x1="880" y1="10" x2="880" y2="16"/><line x1="920" y1="10" x2="920" y2="16"/><line x1="960" y1="10" x2="960" y2="16"/><line x1="1000" y1="10" x2="1000" y2="16"/><line x1="1040" y1="7" x2="1040" y2="19"/><line x1="1080" y1="10" x2="1080" y2="16"/><line x1="1120" y1="10" x2="1120" y2="16"/><line x1="1160" y1="10" x2="1160" y2="16"/></g>
<g class="run"><rect x="-160" y="11.5" width="160" height="3" rx="1.5" fill="url(#dt)"/><circle cx="0" cy="13" r="4" fill="#9DFFC6"/><circle cx="0" cy="13" r="9" fill="#5CFF9E" fill-opacity=".25"/></g>
