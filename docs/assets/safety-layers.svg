<text x="230" y="280" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#EDE6DA">SQL guard</text>
<text x="230" y="300" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#B8AC98">lexical check</text></g>
<g class="g g1"><rect x="380" y="96" width="20" height="150" rx="10" fill="#121A15" stroke="#C9A04F" stroke-opacity=".65" stroke-width="1.5"/>
