<g class="msg1"><text x="230" y="350" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#FF9C90">✗ refused before connecting</text></g>
<g class="msg2"><text x="870" y="350" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#FFB347">✎ still written to the log</text></g>
<g class="msg0"><text x="550" y="350" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#7DE3A9">✓ read-only, time-limited, rolled back</text></g>
<text x="40" y="60" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#7E7466">FIVE LAYERS · THE ROLE IS THE REAL GUARANTEE</text>

