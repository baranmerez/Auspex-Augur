<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Five safety layers: SQL guard, READ ONLY transaction, cursor and extended protocol, read-only database role, audit log">
<title>Five safety layers: SQL guard, READ ONLY transaction, cursor and extended protocol, read-only database role, audit log</title>
<style>
.ok { opacity: 0; animation: ok 9s linear infinite; }
@keyframes ok { 0% { transform: translate(110px, 171px); opacity: 0; } 2.22% { transform: translate(110px, 171px); opacity: 1; } 42.22% { transform: translate(870px, 171px); opacity: 1; } 48.89% { transform: translate(1000px, 171px); opacity: 1; } 51.11%, 100% { transform: translate(1000px, 171px); opacity: 0; } }
.bad { opacity: 0; animation: bad 9s linear infinite; }
@keyframes bad { 0%, 51.11% { transform: translate(110px, 171px); opacity: 0; } 52.22% { transform: translate(110px, 171px); opacity: 1; } 60.00% { transform: translate(190px, 171px); opacity: 1; } 64.44% { transform: translate(160px, 171px); opacity: 1; } 70.00%, 100% { transform: translate(160px, 171px); opacity: 0; } }
.msg0, .msg1, .msg2 { opacity: 0; animation: 9s linear infinite; }
.msg0 { animation-name: m0; } .msg1 { animation-name: m1; } .msg2 { animation-name: m2; }
@keyframes m0 { 0%, 11.11% { opacity: 0; } 14.44%, 46.67% { opacity: 1; } 50.00%, 100% { opacity: 0; } }
@keyframes m1 { 0%, 60.00% { opacity: 0; } 62.22%, 91.11% { opacity: 1; } 94.44%, 100% { opacity: 0; } }
@keyframes m2 { 0%, 72.22% { opacity: 0; } 74.44%, 91.11% { opacity: 1; } 94.44%, 100% { opacity: 0; } }
