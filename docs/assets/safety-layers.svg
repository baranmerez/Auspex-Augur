.g1 rect { animation: g1 9s linear infinite; }
@keyframes g1 { 0%, 16.40% { fill: #121A15; stroke: #C9A04F; } 17.51%, 23.63% { fill: #1F5A36; stroke: #5CFF9E; } 28.07% { fill: #121A15; stroke: #C9A04F; } 100% { fill: #121A15; stroke: #C9A04F; } }
.g2 rect { animation: g2 9s linear infinite; }
@keyframes g2 { 0%, 24.82% { fill: #121A15; stroke: #C9A04F; } 25.94%, 32.05% { fill: #1F5A36; stroke: #5CFF9E; } 36.49% { fill: #121A15; stroke: #C9A04F; } 100% { fill: #121A15; stroke: #C9A04F; } }
.g3 rect { animation: g3 9s linear infinite; }
@keyframes g3 { 0%, 33.25% { fill: #121A15; stroke: #C9A04F; } 34.36%, 40.47% { fill: #1F5A36; stroke: #5CFF9E; } 44.91% { fill: #121A15; stroke: #C9A04F; } 100% { fill: #121A15; stroke: #C9A04F; } }
.g4 rect { animation: g4 9s linear infinite; }
@keyframes g4 { 0%, 41.67% { fill: #121A15; stroke: #C9A04F; } 42.78%, 48.89% { fill: #1F5A36; stroke: #5CFF9E; } 53.33% { fill: #121A15; stroke: #C9A04F; } 72.22% { fill: #121A15; stroke: #C9A04F; } 73.33%, 84.44% { fill: #4A3410; stroke: #FFB347; } 87.78% { fill: #121A15; stroke: #C9A04F; } 100% { fill: #121A15; stroke: #C9A04F; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17120E"/><stop offset=".55" stop-color="#121310"/><stop offset="1" stop-color="#0D1A13"/></linearGradient>
