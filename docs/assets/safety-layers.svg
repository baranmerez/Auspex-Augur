<text x="550" y="280" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#EDE6DA">Cursor</text>
<text x="550" y="300" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#B8AC98">extended protocol</text></g>
<g class="g g3"><rect x="700" y="96" width="20" height="150" rx="10" fill="#121A15" stroke="#C9A04F" stroke-opacity=".65" stroke-width="1.5"/>
<text x="710" y="80" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#C9A04F">4</text>
<text x="710" y="280" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#EDE6DA">Read-only</text>
<text x="710" y="300" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#B8AC98">database role</text></g>
<g class="g g4"><rect x="860" y="96" width="20" height="150" rx="10" fill="#121A15" stroke="#C9A04F" stroke-opacity=".65" stroke-width="1.5"/>
<text x="870" y="80" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#C9A04F">5</text>
<text x="870" y="280" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#EDE6DA">Audit log</text>
<text x="870" y="300" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#B8AC98">every call</text></g>
<g class="ok"><rect x="-34" y="-13" width="68" height="26" rx="13" fill="#13301F" stroke="#5CFF9E"/><text y="5" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#9DFFC6">SELECT</text></g>
