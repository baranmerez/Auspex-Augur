<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Auspex drafts a change script that starts with BEGIN and ends with ROLLBACK, never runs it, and hands it to you; you review it, run it and swap ROLLBACK for COMMIT">
<title>Auspex drafts a change script that starts with BEGIN and ends with ROLLBACK, never runs it, and hands it to you; you review it, run it and swap ROLLBACK for COMMIT</title>
<style>
.l, .k1, .k2, .cm { opacity: 0; animation: 10s ease-out infinite; }
.l0 { animation-name: l0; } .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; } .l4 { animation-name: l4; } .l5 { animation-name: l5; }
.k1 { animation-name: k1; } .k2 { animation-name: k2; } .cm { animation-name: cm; }
@keyframes l0 { 0%, 3.00% { opacity: 0; transform: translateY(8px); } 5.50%, 93.00% { opacity: 1; transform: none; } 95.50%, 100% { opacity: 0; } }
