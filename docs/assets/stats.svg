<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="24 MCP tools, 5 safety layers, 0 write paths, 5 agent skills">
<title>24 MCP tools, 5 safety layers, 0 write paths, 5 agent skills</title>
<style>
.sc { animation: up .7s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.pr { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pr 2.4s ease-out infinite; }
@keyframes pr { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
.sw { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.num { animation: glow 3s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .82; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17120E"/><stop offset="1" stop-color="#0D1A13"/></linearGradient></defs>
<g class="sc" style="animation-delay:0.00s">
<rect x="24" y="18" width="276" height="114" rx="18" fill="url(#sbg)" stroke="#C9A04F" stroke-opacity=".4"/>
<text x="52" y="88" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#E7C77F" class="num">24</text>
<text x="52" y="114" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="1.2" fill="#B8AC98">MCP TOOLS</text>
<circle cx="254" cy="75" r="22" fill="none" stroke="#E7C77F" stroke-opacity=".35"/>
<circle cx="254" cy="75" r="11" fill="none" stroke="#E7C77F" stroke-opacity=".25"/>
