<g class="sw" style="transform-origin:254px 75px;animation-delay:-0s"><line x1="254" y1="75" x2="254" y2="53" stroke="#E7C77F" stroke-width="2" stroke-linecap="round"/></g>
<circle cx="254" cy="75" r="2.5" fill="#E7C77F"/>
</g>
<g class="sc" style="animation-delay:0.18s">
